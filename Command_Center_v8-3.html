function renderYOY(){
  var ty=new Date().getFullYear(),ly=ty-1,mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var td=new Array(12).fill(0),ld=new Array(12).fill(0);
  state.ledger.filter(function(l){return l.type==="income";}).forEach(function(l){if(!l.date)return;var d=new Date(l.date),y=d.getFullYear(),m=d.getMonth();if(y===ty)td[m]+=l.amount;else if(y===ly)ld[m]+=l.amount;});
  var has=td.some(function(v){return v>0;})||ld.some(function(v){return v>0;});
  if(!has)return'<p style="font-size:13px;color:var(--dimmer);">No income data for comparison.</p>';
  var mV=Math.max.apply(null,td.concat(ld))||1,W=500,H=110,pL=50,pB=24,pT=8,pR=10,bW=Math.max(6,Math.floor((W-pL-pR)/(12*2+12*0.4)));
  var c='<div style="overflow-x:auto;"><svg viewBox="0 0 '+W+' '+(H+pB+pT)+'" style="width:100%;max-width:600px;height:auto;">';
  [0,0.5,1].forEach(function(t){var y=pT+H*(1-t);c+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/><text x="'+(pL-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="var(--dim)">'+fmtK(mV*t)+'</text>';});
  for(var i=0;i<12;i++){var x=pL+i*(bW*2+3),th=Math.max(2,Math.round((td[i]/mV)*H)),lh=Math.max(2,Math.round((ld[i]/mV)*H));if(ld[i]>0)c+='<rect x="'+x+'" y="'+(pT+H-lh)+'" width="'+bW+'" height="'+lh+'" fill="var(--border2)" rx="1"><title>'+ly+' '+mn[i]+': '+fmt(ld[i])+'</title></rect>';if(td[i]>0)c+='<rect x="'+(x+bW+1)+'" y="'+(pT+H-th)+'" width="'+bW+'" height="'+th+'" fill="var(--accent)" rx="1"><title>'+ty+' '+mn[i]+': '+fmt(td[i])+'</title></rect>';c+='<text x="'+(x+bW)+'" y="'+(pT+H+14)+'" text-anchor="middle" font-size="9" fill="var(--dim)">'+mn[i]+'</text>';}
  c+='<rect x="'+pL+'" y="'+(pT+H+20)+'" width="8" height="5" fill="var(--border2)" rx="1"/><text x="'+(pL+11)+'" y="'+(pT+H+26)+'" font-size="9" fill="var(--dim)">'+ly+'</text><rect x="'+(pL+50)+'" y="'+(pT+H+20)+'" width="8" height="5" fill="var(--accent)" rx="1"/><text x="'+(pL+61)+'" y="'+(pT+H+26)+'" font-size="9" fill="var(--dim)">'+ty+'</text></svg></div>';
  var tT=td.reduce(function(s,v){return s+v;},0),lT=ld.reduce(function(s,v){return s+v;},0),grw=lT?Math.round((tT-lT)/lT*100):null;
  c+='<div style="margin-top:10px;font-size:13px;color:var(--dim);">'+ty+' YTD: <b style="color:var(--text);">'+fmt(tT)+'</b> &nbsp;|&nbsp; '+ly+': <b style="color:var(--text);">'+fmt(lT)+'</b>'+(grw!==null?' &nbsp;|&nbsp; Growth: <b style="color:'+(grw>=0?"var(--good)":"var(--danger)")+';">'+(grw>=0?"+":"")+grw+'%</b>':'')+'</div>';
  return c;
}

  sorted.forEach(function(b){
    var sku=state.skus.find(function(s){return s.id===b.skuId;})||{name:"Unknown",unit:"pkt",costPrice:0};

    html+='<tr>'+
      '<td style="white-space:nowrap;">'+fmtDate(b.date)+'</td>'+
      '<td style="font-weight:600;">'+esc(sku.name)+'</td>'+

function checkReconciliation(){
  var ledgerNet=state.ledger.filter(function(l){return !l.isTransfer;}).reduce(function(s,l){return s+(l.type==="income"?l.amount:-l.amount);},0);
  var expected=state.settings.startingCash+state.settings.startingBank+ledgerNet;
  var actual=totalBalance();
  var diff=actual-expected;
  var ok=Math.abs(diff)<1;
  var body='<div class="'+(ok?"recon-ok":"recon-fail")+'" style="font-size:13px;line-height:2.2;">';
  body+='<p style="font-weight:700;margin:0 0 10px;">'+(ok?"All balanced - no discrepancy found":"Discrepancy found - check entries")+'</p>';
  body+='<div style="display:flex;justify-content:space-between;"><span>Starting balance</span><span class="mono">'+fmt(state.settings.startingCash+state.settings.startingBank)+'</span></div>';
  body+='<div style="display:flex;justify-content:space-between;"><span>Ledger net (excl. transfers)</span><span class="mono">'+fmt(ledgerNet)+'</span></div>';
  body+='<div style="display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--border);padding-top:6px;margin-top:4px;"><span>Expected balance</span><span class="mono">'+fmt(expected)+'</span></div>';
  body+='<div style="display:flex;justify-content:space-between;font-weight:700;"><span>Recorded balance</span><span class="mono">'+fmt(actual)+'</span></div>';
  if(!ok)body+='<div style="display:flex;justify-content:space-between;color:var(--danger);font-weight:700;margin-top:4px;"><span>Difference</span><span class="mono">'+fmt(diff)+'</span></div>';
  body+='</div>';
  openModal(modalShell("Balance reconciliation",body));
}

function delItem(key,id){
  var LBL={ledger:"ledger entry",team:"team member",skus:"product",rawMaterials:"raw material",batches:"batch",goals:"goal",debts:"loan",vehicles:"vehicle",taxItems:"reminder",festivals:"festival plan",returns:"return",leaves:"leave",advances:"advance",wagePayments:"wage payment"};
  var lbl=LBL[key]||"record";
  var item=state[key]?state[key].find(function(x){return x.id===id;}):null;
  var warn="";
  if(key==="team"){
    var ac=(state.attendance||[]).filter(function(a){return a.teamId===id;}).length;
    var ad=(state.advances||[]).filter(function(a){return a.teamId===id;}).length;
    var wp=(state.wagePayments||[]).filter(function(w){return w.teamId===id;}).length;
    var lv=(state.leaves||[]).filter(function(l){return l.teamId===id;}).length;
    var pts=[ac&&ac+" attendance",ad&&ad+" advance(s)",wp&&wp+" wage payment(s)",lv&&lv+" leave(s)"].filter(Boolean);
    if(pts.length)warn=" Their "+pts.join(", ")+" will also be removed.";
  }
  if(key==="skus"){
    var dc=state.dispatches.filter(function(d){return d.skuId===id;}).length;
    var bc=state.batches.filter(function(b){return b.skuId===id;}).length;
    if(dc||bc)warn=" Warning: "+[dc&&dc+" dispatch(es)",bc&&bc+" batch(es)"].filter(Boolean).join(" and ")+" reference this product.";
  }
  if(key==="rawMaterials"){
    var pc=(state.materialPurchases||[]).filter(function(p){return p.materialId===id;}).length;
    if(pc)warn=" "+pc+" purchase(s) will also be removed.";
  }
  confirmDo("Delete "+lbl,"Delete this "+lbl+"?"+warn+" This cannot be undone.",function(){
    if(item)_pushU(key,item,item.name||item.title||item.lender||item.category||lbl);
    if(key==="team"){state.team=state.team.filter(function(x){return x.id!==id;});state.attendance=(state.attendance||[]).filter(function(a){return a.teamId!==id;});state.advances=(state.advances||[]).filter(function(a){return a.teamId!==id;});state.wagePayments=(state.wagePayments||[]).filter(function(w){return w.teamId!==id;});state.leaves=(state.leaves||[]).filter(function(l){return l.teamId!==id;});}

var _pf=0,_plu=0;
function _chkLk(eid){if(Date.now()<_plu){var el=document.getElementById(eid);if(el)el.textContent="Locked "+Math.ceil((_plu-Date.now())/1000)+"s. Too many wrong PINs.";return true;}return false;}
function _regFail(eid){_pf++;var el=document.getElementById(eid);if(_pf>=5){_plu=Date.now()+60000;_pf=0;if(el)el.textContent="Locked 60s after 5 wrong attempts.";}else{if(el)el.textContent="Wrong PIN. "+(5-_pf)+" left.";}}
function _clrFail(){_pf=0;_plu=0;}
function tryMultiLogin(){
  if(_chkLk("pin_err"))return;
  var inp=document.getElementById("pin_inp"),u=(state.users||[]).find(function(x){return x.id===_pendingUserId;});
  if(!u){renderUserSelect();return;}
  if(!inp||inp.value!==u.pin){_regFail("pin_err");if(inp){inp.value="";inp.focus();}return;}
  _clrFail();
  session={userId:u.id,userName:u.name,role:u.role,loggedIn:true};
  state.users=(state.users||[]).map(function(x){return x.id===u.id?Object.assign({},x,{lastLogin:today()}):x;});
  if(!state.sessionLog)state.sessionLog=[];
  state.sessionLog.push({userId:u.id,userName:u.name,role:u.role,timestamp:new Date().toISOString()});
  if(state.sessionLog.length>50)state.sessionLog=state.sessionLog.slice(-50);
  save();audit("Login","Logged in");_pendingUserId=null;renderShell();
}
function checkLockPin(){
  if(_chkLk("lockErr"))return;
  var inp=document.getElementById("lockPin"),pin=inp?inp.value:"";
  var ok=state.settings.multiUserEnabled?(function(){var u=(state.users||[]).find(function(x){return x.id===session.userId;});return u&&pin===u.pin;})():(!state.settings.pin||pin===state.settings.pin);
  if(ok){_clrFail();var el=document.getElementById("lockOverlay");if(el)el.className="";if(inp)inp.value="";resetActivity();showToast("Welcome back, "+session.userName,"success",2000);}
  else{_regFail("lockErr");if(inp){inp.value="";inp.focus();}}
}

  el.style.background=over?"var(--danger-dim)":avail>0?"var(--good-dim)":"var(--warn-dim)";

function saveDispatch(){
  var qty=Number(val("m_qty")),rate=Number(val("m_rate"));
  if(!qty||!rate){showToast("Enter quantity and rate","warn");return;}
  var skuId=val("m_skuId"),accountId=val("m_accountId"),avail=finishedStock(skuId);
  var sku=state.skus.find(function(s){return s.id===skuId;})||{name:"Unknown"};
  var acc=state.accounts.find(function(a){return a.id===accountId;})||{name:"Unknown"};
  function go(){
    state.dispatches.push({id:uid(),accountId:accountId,date:val("m_date")||today(),skuId:skuId,qty:qty,rate:rate});

function clearLedgerFilters(){ui.ledgerFrom="";ui.ledgerTo="";ui.ledgerSearch="";ui.ledgerType="all";ui.ledgerPage=0;renderContent();}
function renderLedger(){
  var PG=25;
  if(ui.ledgerPage===undefined)ui.ledgerPage=0;
  var from=ui.ledgerFrom||"",to=ui.ledgerTo||"",srch=(ui.ledgerSearch||"").toLowerCase(),tF=ui.ledgerType||"all";
  var rows=state.ledger.filter(function(l){
    if(from&&l.date<from)return false;
    if(to&&l.date>to)return false;
    if(tF!=="all"&&l.type!==tF)return false;
    if(srch&&!(l.category+"|"+(l.note||"")+(l.method||"")).toLowerCase().includes(srch))return false;
    return true;
  }).sort(function(a,b){return(b.date||"").localeCompare(a.date||"")||((b.createdAt||"").localeCompare(a.createdAt||""));});
  var totPg=Math.max(1,Math.ceil(rows.length/PG));
  ui.ledgerPage=Math.min(ui.ledgerPage,totPg-1);
  var pRows=rows.slice(ui.ledgerPage*PG,(ui.ledgerPage+1)*PG);
  var totIn=rows.filter(function(l){return l.type==="income";}).reduce(function(s,l){return s+l.amount;},0);
  var totEx=rows.filter(function(l){return l.type==="expense";}).reduce(function(s,l){return s+l.amount;},0);

  var html=sectionHead("Financial Ledger","Every income and expense. "+rows.length+" entries total.",addBtn);
  html+='<div class="card pad" style="margin-bottom:12px;"><div class="flex wrap gap-2">'
    +'<input class="input" style="max-width:150px;" type="date" value="'+from+'" oninput="ui.ledgerFrom=this.value;ui.ledgerPage=0;renderContent()">'
    +'<input class="input" style="max-width:150px;" type="date" value="'+to+'" oninput="ui.ledgerTo=this.value;ui.ledgerPage=0;renderContent()">'
    +'<select class="select" style="max-width:140px;" onchange="ui.ledgerType=this.value;ui.ledgerPage=0;renderContent()"><option value="all">All types</option><option value="income"'+(tF==="income"?" selected":"")+'>Income</option><option value="expense"'+(tF==="expense"?" selected":"")+'>Expense</option></select>'
    +'<input class="input" style="flex:1;min-width:150px;" placeholder="Search category, note…" value="'+esc(srch)+'" oninput="ui.ledgerSearch=this.value;ui.ledgerPage=0;renderContent()">'
    +'<button class="btn btn-ghost btn-sm" onclick="clearLedgerFilters()">Clear</button></div></div>';
  if(!rows.length)return html+emptyStateHtml("No entries match your filters.");
  html+='<div class="card" style="overflow-x:auto;"><table id="ledTbl" class="sticky-table" style="min-width:620px;"><thead><tr>'
    +'<th>Date</th><th>Type</th><th>Category</th><th>Method</th><th>Note</th><th class="right">Amount</th>'
    +(can("ledger.write")?"<th style=\"width:70px;\"></th>":"")+"</tr></thead><tbody>";
  pRows.forEach(function(l){
    var isT=l.isTransfer;
    html+="<tr"+(isT?' style="opacity:.65;"':"")+">";
    html+='<td style="white-space:nowrap;font-size:12.5px;">'+fmtDate(l.date)+(isT?' <span style="font-size:10px;background:var(--border);border-radius:4px;padding:1px 4px;">Transfer</span>':"")+"</td>";
    html+='<td>'+badge(l.type==="income"?"income":"expense",l.type==="income"?"good":"bad")+"</td>";
    html+='<td style="font-weight:600;font-size:13px;">'+esc(l.category)+"</td>";
    html+='<td style="font-size:12px;color:var(--dim);">'+esc(l.method||"")+"</td>";
    html+='<td style="font-size:12px;color:var(--dim);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(l.note||"")+'">'+esc(l.note||"")+"</td>";
    html+='<td class="right mono '+(l.type==="income"?"tone-good":"tone-bad")+'" style="font-weight:600;">'+fmt(l.amount)+"</td>";
    if(can("ledger.write"))html+='<td class="right" style="white-space:nowrap;">'+btn(ic("pencil",13),"editLed",l.id,"icon-btn")+" "+btn(ic("trash",13),"delLed",l.id,"icon-btn")+"</td>";
    html+="</tr>";
  });
  html+='<tr style="background:var(--surface2);border-top:2px solid var(--border2);font-weight:700;"><td colspan="5" style="font-size:13px;">'+(ui.ledgerPage*PG+1)+'–'+Math.min((ui.ledgerPage+1)*PG,rows.length)+' of '+rows.length+' entries</td><td class="right mono"><span class="tone-good">+'+fmt(totIn)+'</span> / <span class="tone-bad">-'+fmt(totEx)+'</span></td>'+(can("ledger.write")?"<td></td>":"")+'</tr></tbody></table></div>';
  if(totPg>1){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;">';
    html+='<span style="font-size:12.5px;color:var(--dim);">Page '+(ui.ledgerPage+1)+' of '+totPg+'</span><div class="flex gap-1">';
    if(ui.ledgerPage>0)html+='<button class="btn btn-outline btn-sm" onclick="ui.ledgerPage=0;renderContent()">«</button><button class="btn btn-outline btn-sm" onclick="ui.ledgerPage--;renderContent()">‹</button>';

    html+='</div></div>';
  }
  return html;
}

function addCat(type){
  var inputId=type==="income"?"newIC":"newEC";
  var el=document.getElementById(inputId);
  var v=el?el.value.trim():"";
  if(!v){showToast("Enter a category name","warn");return;}
  if(type==="income"){
    if(!state.settings.incomeCats||!state.settings.incomeCats.length)state.settings.incomeCats=DINC.slice();
    if(state.settings.incomeCats.includes(v)){showToast("Category already exists","warn");return;}
    state.settings.incomeCats.push(v);
  } else {
    if(!state.settings.expenseCats||!state.settings.expenseCats.length)state.settings.expenseCats=DEXP.slice();
    if(state.settings.expenseCats.includes(v)){showToast("Category already exists","warn");return;}
    state.settings.expenseCats.push(v);
  }
  showToast("Category added","success");commit();
}
function removeCat(type,idx){
  if(type==="income"){
    if(!state.settings.incomeCats||!state.settings.incomeCats.length)state.settings.incomeCats=DINC.slice();
    state.settings.incomeCats.splice(Number(idx),1);
  } else {
    if(!state.settings.expenseCats||!state.settings.expenseCats.length)state.settings.expenseCats=DEXP.slice();
    state.settings.expenseCats.splice(Number(idx),1);
  }
  showToast("Category removed","success");commit();
}

/* ── STOCK FUNCTIONS (include opening stock) ── */
function finishedStock(skuId){
  var prod=state.batches.filter(function(b){return b.skuId===skuId;}).reduce(function(s,b){return s+(b.outputQty||0)-(b.wastageQty||0);},0);
  var disp=state.dispatches.filter(function(d){return d.skuId===skuId;}).reduce(function(s,d){return s+d.qty;},0);
  var ret=(state.returns||[]).filter(function(r){return r.skuId===skuId;}).reduce(function(s,r){return s+r.qty;},0);
  return Math.max(0,prod-disp+ret);
}
function materialStock(matId){
  var os=(state.materialOpeningStock||[]).find(function(x){return x.materialId===matId;});
  var openQty=os?os.qty:0;
  var purch=(state.materialPurchases||[]).filter(function(p){return p.materialId===matId;}).reduce(function(s,p){return s+p.qty;},0);
  var used=0;
  state.batches.forEach(function(b){(b.materialsUsed||[]).forEach(function(mu){if(mu.materialId===matId)used+=mu.qty;});});
  return Math.max(0,openQty+purch-used);
}

function openDispatchModal(accountId){
  var a=state.accounts.find(function(x){return x.id===accountId;});if(!a)return;
  if(!state.skus.length){showToast('Add a product first','warn');return;}
  var skuOpts=state.skus.map(function(s){return'<option value="'+s.id+'" data-price="'+(s.sellingPrice||0)+'" data-cost="'+(s.costPrice||0)+'">'+esc(s.name)+' ('+finishedStock(s.id)+' in stock)</option>';}).join('');
  var vatField=state.settings.vatEnabled?fieldWrap('Apply VAT','<label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="m_vat" onchange="updDCalc()"> Add '+state.settings.vatRate+'% VAT</label>'):'';
  var b='<input type="hidden" id="m_accountId" value="'+accountId+'">'
    +fieldWrap('Product','<select class="select" id="m_skuId" onchange="updDS(this.value)">'+skuOpts+'</select>')
    +'<div id="dstockInfo" style="font-size:12.5px;padding:7px 10px;border-radius:6px;margin-bottom:12px;"></div>'
    +fieldWrap('Quantity (packets)','<input class="input" id="m_qty" type="number" min="1" placeholder="e.g. 50" oninput="updDCalc()">')
    +fieldWrap('Rate per packet (NPR)','<input class="input" id="m_rate" type="number" placeholder="e.g. 50" oninput="updDCalc()">')
    +vatField
    +fieldWrap('Discount (NPR)','<input class="input" id="m_disc" type="number" value="0" oninput="updDCalc()">')
    +'<div id="dCalcInfo" style="font-size:12.5px;padding:10px;border-radius:8px;background:var(--surface2);margin-bottom:12px;display:none;"></div>'
    +fieldWrap('Date','<input class="input" id="m_date" type="date" value="'+today()+'">')
    +fieldWrap('Notes (optional)','<input class="input" id="m_notes" placeholder="e.g. Dashain special delivery">')
    +'<button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:8px;" onclick="saveDispatch()">Save dispatch</button>';
  openModal(modalShell('New dispatch — '+a.name,b));
  setTimeout(function(){updDS(state.skus[0].id);},80);
}

function updDS(skuId){
  var avail=finishedStock(skuId),el=document.getElementById('dstockInfo');if(!el)return;
  var qty=Number(val('m_qty'))||0,over=qty>0&&qty>avail;
  el.style.background=over?'var(--danger-dim)':avail>0?'var(--good-dim)':'var(--warn-dim)';
  el.style.color=over?'var(--danger)':avail>0?'var(--good)':'var(--warn)';
  el.textContent='In stock: '+avail+' packets'+(over?' — Warning: only '+avail+' available!':'');
  var sku=state.skus.find(function(s){return s.id===skuId;});
  var rateEl=document.getElementById('m_rate');
  if(rateEl&&sku&&!rateEl.value){
    var accId=(document.getElementById('m_accountId')||{}).value||'';
    var acc=accId?state.accounts.find(function(a){return a.id===accId;}):null;
    var defaultRate=(acc&&acc.priceList==='distributor'&&sku.distributorPrice)?sku.distributorPrice:sku.sellingPrice||0;
    if(defaultRate)rateEl.value=defaultRate;
  }
  updDCalc();
}

function updDCalc(){
  var qty=Number(val('m_qty'))||0,rate=Number(val('m_rate'))||0,disc=Number(val('m_disc'))||0;
  var vatEl=document.getElementById('m_vat');
  var vatAmt=vatEl&&vatEl.checked?Math.round(qty*rate*(state.settings.vatRate||13)/100):0;
  var total=qty*rate+vatAmt-disc;
  var el=document.getElementById('dCalcInfo');if(!el)return;
  if(!qty||!rate){el.style.display='none';return;}
  el.style.display='block';
  var skuId=val('m_skuId'),sku=state.skus.find(function(s){return s.id===skuId;})||{costPrice:0};
  var profit=qty*(rate-(sku.costPrice||0));
  el.innerHTML='Subtotal: <b>'+fmt(qty*rate)+'</b>'+(vatAmt?' + VAT: <b>'+fmt(vatAmt)+'</b>':'')+(disc?' − Discount: <b>'+fmt(disc)+'</b>':'')+'<br><b>Total: '+fmt(total)+'</b>'+(sku.costPrice?' · Profit: <b style="color:'+(profit>=0?'var(--good)':'var(--danger)')+'">'+fmt(profit)+'</b>':'');

function saveDispatch(){
  var qty=Number(val('m_qty')),rate=Number(val('m_rate'));
  if(!qty||!rate){showToast('Enter quantity and rate','warn');return;}
  var skuId=val('m_skuId'),accountId=val('m_accountId'),avail=finishedStock(skuId);
  var sku=state.skus.find(function(s){return s.id===skuId;})||{name:'?'};
  var acc=state.accounts.find(function(a){return a.id===accountId;})||{name:'?'};
  var vatEl=document.getElementById('m_vat');
  var vatAmt=vatEl&&vatEl.checked?Math.round(qty*rate*(state.settings.vatRate||13)/100):0;
  var disc=Number(val('m_disc'))||0;
  function go(){
    state.dispatches.push({id:uid(),accountId:accountId,date:val('m_date')||today(),skuId:skuId,qty:qty,rate:rate,vatAmount:vatAmt,discount:disc,notes:val('m_notes')||'',createdAt:new Date().toISOString()});

}

  var cat=val('m_category');if(!cat){showToast('Select a category','warn');return;}
  var data={type:val('m_type')||'income',category:cat,amount:amount,method:val('m_method')||'cash',date:val('m_date')||today(),note:val('m_note')||''};
  if(id){state.ledger=state.ledger.map(function(l){return l.id===id?Object.assign({},l,data):l;});audit('Ledger','Edited '+data.type+' '+fmt(amount)+' — '+cat);showToast('Entry updated','success');}
  else{state.ledger.push(Object.assign({id:uid(),createdAt:new Date().toISOString()},data));audit('Ledger','Added '+data.type+' '+fmt(amount)+' — '+cat);showToast('Entry saved','success');}
  closeModal();commit();

function renderLedger(){
  var PG=25;if(ui.ledgerPage===undefined)ui.ledgerPage=0;
  var from=ui.ledgerFrom||'',to=ui.ledgerTo||'',srch=(ui.ledgerSearch||'').toLowerCase(),tF=ui.ledgerType||'all';
  var rows=state.ledger.filter(function(l){if(from&&l.date<from)return false;if(to&&l.date>to)return false;if(tF!=='all'&&l.type!==tF)return false;if(srch&&!(l.category+'|'+(l.note||'')+(l.method||'')).toLowerCase().includes(srch))return false;return true;}).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')||((b.createdAt||'').localeCompare(a.createdAt||''));});
  var totPg=Math.max(1,Math.ceil(rows.length/PG));ui.ledgerPage=Math.min(ui.ledgerPage,totPg-1);
  var pRows=rows.slice(ui.ledgerPage*PG,(ui.ledgerPage+1)*PG);
  var totIn=rows.filter(function(l){return l.type==='income';}).reduce(function(s,l){return s+l.amount;},0);
  var totEx=rows.filter(function(l){return l.type==='expense';}).reduce(function(s,l){return s+l.amount;},0);
  var addBtn=can('ledger.write')?'<div class="flex gap-2"><button class="btn btn-accent" onclick="openLedgerForm()">'+ic('plus',15)+' Add entry</button><button class="btn btn-outline" onclick="openTransferForm()">⇄ Transfer</button><button class="btn btn-outline" onclick="openPrintDialog(\'ledger\')">🖨 Print</button></div>':'';
  var html=sectionHead('Financial Ledger','Every income and expense. '+rows.length+' entries total.',addBtn);
  html+='<div class="card pad" style="margin-bottom:12px;"><div class="flex wrap gap-2">'
    +'<input class="input" style="max-width:150px;" type="date" value="'+from+'" oninput="ui.ledgerFrom=this.value;ui.ledgerPage=0;renderContent()">'
    +'<input class="input" style="max-width:150px;" type="date" value="'+to+'" oninput="ui.ledgerTo=this.value;ui.ledgerPage=0;renderContent()">'
    +'<select class="select" style="max-width:140px;" onchange="ui.ledgerType=this.value;ui.ledgerPage=0;renderContent()"><option value="all">All types</option><option value="income"'+(tF==='income'?' selected':'')+'>Income</option><option value="expense"'+(tF==='expense'?' selected':'')+'>Expense</option></select>'
    +'<input class="input" style="flex:1;min-width:150px;" placeholder="Search category, note…" value="'+esc(srch)+'" oninput="ui.ledgerSearch=this.value;ui.ledgerPage=0;renderContent()">'
    +'<button class="btn btn-ghost btn-sm" onclick="clearLedgerFilters()">Clear</button></div></div>';
  if(!rows.length)return html+emptyStateHtml('No entries match your filters.');
  html+='<div class="card" style="overflow-x:auto;"><table id="ledTbl" class="sticky-table" style="min-width:620px;"><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Method</th><th>Note</th><th class="right">Amount</th>'+(can('ledger.write')?'<th style="width:80px;"></th>':'')+' </tr></thead><tbody>';
  pRows.forEach(function(l){
    var isT=l.isTransfer;
    html+='<tr'+(isT?' style="opacity:.65;"':'')+'>'+
      '<td style="white-space:nowrap;font-size:12.5px;">'+fmtDate(l.date)+(isT?' <span style="font-size:10px;background:var(--border);border-radius:4px;padding:1px 4px;">Transfer</span>':'')+'</td>'+
      '<td>'+badge(l.type==='income'?'income':'expense',l.type==='income'?'good':'bad')+'</td>'+
      '<td style="font-weight:600;font-size:13px;">'+esc(l.category)+'</td>'+
      '<td style="font-size:12px;color:var(--dim);">'+esc(l.method||'')+'</td>'+
      '<td style="font-size:12px;color:var(--dim);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+esc(l.note||'')+'">'+esc(l.note||'')+'</td>'+
      '<td class="right mono '+(l.type==='income'?'tone-good':'tone-bad')+'" style="font-weight:600;">'+fmt(l.amount)+'</td>'+
      (can('ledger.write')?'<td class="right" style="white-space:nowrap;">'+btn(ic('pencil',13),'editLed',l.id,'icon-btn')+' '+btn(ic('trash',13),'delLed',l.id,'icon-btn')+'<button class="icon-btn" onclick="printLedgerReceipt(\''+l.id+'\')" title="Print receipt">🧾</button></td>':'')+
      '</tr>';
  });
  html+='<tr style="background:var(--surface2);border-top:2px solid var(--border2);font-weight:700;"><td colspan="5" style="font-size:13px;">'+(ui.ledgerPage*PG+1)+'–'+Math.min((ui.ledgerPage+1)*PG,rows.length)+' of '+rows.length+' entries</td><td class="right mono"><span class="tone-good">+'+fmt(totIn)+'</span> / <span class="tone-bad">-'+fmt(totEx)+'</span></td>'+(can('ledger.write')?'<td></td>':'')+' </tr></tbody></table></div>';
  if(totPg>1){
    html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;">';
    html+='<span style="font-size:12.5px;color:var(--dim);">Page '+(ui.ledgerPage+1)+' of '+totPg+'</span><div class="flex gap-1">';
    if(ui.ledgerPage>0)html+='<button class="btn btn-outline btn-sm" onclick="ui.ledgerPage=0;renderContent()">«</button><button class="btn btn-outline btn-sm" onclick="ui.ledgerPage--;renderContent()">‹</button>';
    var s2=Math.max(0,ui.ledgerPage-2),e2=Math.min(totPg-1,ui.ledgerPage+2);
    if(s2>0)html+='<span style="color:var(--dim);padding:0 6px;">…</span>';
    for(var p=s2;p<=e2;p++)html+='<button class="btn btn-sm '+(p===ui.ledgerPage?'btn-accent':'btn-outline')+'" onclick="ui.ledgerPage='+p+';renderContent()">'+(p+1)+'</button>';
    if(e2<totPg-1)html+='<span style="color:var(--dim);padding:0 6px;">…</span>';
    if(ui.ledgerPage<totPg-1)html+='<button class="btn btn-outline btn-sm" onclick="ui.ledgerPage++;renderContent()">›</button><button class="btn btn-outline btn-sm" onclick="ui.ledgerPage='+(totPg-1)+';renderContent()">»</button>';
    html+='</div></div>';
  }
  return html;
}

function processRecurringEntries(){

  (state.recurringEntries||[]).forEach(function(r){

    state.ledger.push({id:uid(),type:r.type,category:r.category,amount:r.amount,method:'cash',date:r.nextDate,note:(r.note||'')+' (auto)',createdAt:new Date().toISOString()});

/* Duplicate Detection */
function checkDuplicates(){
  var issues=[],seen={a:{},s:{},m:{}};
  state.accounts.forEach(function(a){var k=a.name.toLowerCase().trim();if(seen.a[k])issues.push('Duplicate account: '+a.name);else seen.a[k]=1;});
  state.skus.forEach(function(s){var k=s.name.toLowerCase().trim();if(seen.s[k])issues.push('Duplicate product: '+s.name);else seen.s[k]=1;});
  state.rawMaterials.forEach(function(m){var k=m.name.toLowerCase().trim();if(seen.m[k])issues.push('Duplicate material: '+m.name);else seen.m[k]=1;});
  if(!issues.length){showToast('No duplicates found — data is clean','success');return;}
  openModal(modalShell('Duplicate Records','<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--danger);">'+issues.map(function(i){return'<li>'+esc(i)+'</li>';}).join('')+'</ul><p style="font-size:12px;color:var(--dim);margin-top:10px;">Rename or delete duplicates to keep records accurate.</p>'));
}

function processCSVImport(){
  var inp=document.getElementById('csvFileInput');
  if(!inp||!inp.files||!inp.files[0]){showToast('Select a CSV file first','warn');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var lines=e.target.result.split(/\r?\n/).filter(function(l){return l.trim();});
    var imported=0,skipped=0;
    lines.forEach(function(line){
      var p=line.split(',').map(function(x){return x.trim().replace(/^"|"$/g,'');});
      if(!p[0]||p[0].toLowerCase()==='name')return;
      if(state.accounts.find(function(a){return a.name.toLowerCase()===p[0].toLowerCase();})){skipped++;return;}
      state.accounts.push({id:uid(),name:p[0],type:p[1]||'Retailer',phone:p[2]||'',contact:p[3]||'',address:p[4]||'',creditLimit:Number(p[5])||0,notes:'',createdAt:today()});
      imported++;
    });
    if(imported){save();showToast(imported+' accounts imported'+(skipped?' ('+skipped+' duplicates skipped)':''),'success');commit();closeModal();}
    else showToast('No new accounts found. Check format.','warn');
  };
  reader.readAsText(inp.files[0]);
}

/* Break-even Calculator */
function openBreakevenCalc(){
  var totExp=state.ledger.filter(function(l){return l.type==='expense'&&!l.isTransfer;}).reduce(function(s,l){return s+l.amount;},0);
  var totRev=state.ledger.filter(function(l){return l.type==='income'&&!l.isTransfer;}).reduce(function(s,l){return s+l.amount;},0);
  var totDisp=state.dispatches.reduce(function(s,d){return s+d.qty;},0);
  var avgPrc=totDisp?Math.round(totRev/totDisp):0;
  var b=fieldWrap('Fixed monthly costs (NPR)','<input class="input" id="be_fixed" type="number" value="'+(Math.round(totExp/12)||'')+'" placeholder="e.g. rent, salaries">')
    +fieldWrap('Variable cost per packet (NPR)','<input class="input" id="be_var" type="number" placeholder="e.g. raw material + packaging">')
    +fieldWrap('Selling price per packet (NPR)','<input class="input" id="be_price" type="number" value="'+(avgPrc||'')+'">')
    +'<button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:8px;" onclick="calcBreakeven()">Calculate</button>'
    +'<div id="be_result" style="margin-top:12px;"></div>';
  openModal(modalShell('Break-even Calculator',b));
}
function calcBreakeven(){
  var fixed=Number(val('be_fixed')),varr=Number(val('be_var')),price=Number(val('be_price'));
  var el=document.getElementById('be_result');
  if(!price||price<=varr){el.innerHTML='<p style="color:var(--danger);">Selling price must be greater than variable cost.</p>';return;}
  var contrib=price-varr,bePkts=Math.ceil(fixed/contrib),beRev=bePkts*price;
  var totDisp=state.dispatches.reduce(function(s,d){return s+d.qty;},0),monthly=Math.round(totDisp/Math.max(1,6));
  var abv=monthly>=bePkts;
  el.innerHTML='<div style="background:var(--surface2);padding:14px;border-radius:8px;">'
    +'<p style="font-size:11px;color:var(--dim);margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">Break-even Analysis</p>'
    +'<div style="display:flex;gap:14px;flex-wrap:wrap;">'
    +'<div style="flex:1;"><p style="font-size:11px;color:var(--dim);">Contribution/packet</p><p style="font-size:20px;font-weight:800;color:var(--good);">'+fmt(contrib)+'</p></div>'
    +'<div style="flex:1;"><p style="font-size:11px;color:var(--dim);">Break-even packets/month</p><p style="font-size:20px;font-weight:800;color:var(--accent);">'+bePkts+'</p></div>'
    +'<div style="flex:1;"><p style="font-size:11px;color:var(--dim);">Break-even revenue</p><p style="font-size:20px;font-weight:800;">'+fmt(Math.round(beRev))+'</p></div>'
    +'</div>'
    +(monthly?'<p style="font-size:12px;color:var(--dim);margin-top:10px;border-top:1px solid var(--border);padding-top:8px;">Avg monthly dispatch: <b>'+monthly+' pkts</b> — <b style="color:'+(abv?'var(--good)':'var(--danger)')+';">'+(abv?'Above break-even ✓':'Below by '+(bePkts-monthly)+' pkts')+'</b></p>':'')
    +'</div>';
}

/* Days of stock remaining */
function daysOfStockLeft(skuId){
  var inStock=finishedStock(skuId);
  var cutoff=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  var last30=state.dispatches.filter(function(d){return d.skuId===skuId&&d.date>=cutoff;}).reduce(function(s,d){return s+d.qty;},0);
  var dailyRate=last30/30;
  return dailyRate>0.1?Math.round(inStock/dailyRate):null;
}

  if(e.key==='Escape'){var m=document.getElementById('modalRoot');if(m&&m.innerHTML.length>10)closeModal();}
  if(e.ctrlKey||e.metaKey){
    var ae=document.activeElement,inp=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT');
    if(inp)return;

    if(e.key==='p'){e.preventDefault();if(typeof openPrintDialog==='function')openPrintDialog(ui&&ui.tab||'');}

  var mOpen=document.getElementById('modalRoot')&&document.getElementById('modalRoot').innerHTML.length>10;
  if(!mOpen){

});

/* Dashboard date range */
var _dashRange='month',_dashFrom='',_dashTo='';
function setDashRange(r){
  _dashRange=r;var now=new Date();
  if(r==='today'){_dashFrom=today();_dashTo=today();}
  else if(r==='week'){var d=new Date(now);d.setDate(d.getDate()-6);_dashFrom=d.toISOString().slice(0,10);_dashTo=today();}
  else if(r==='month'){_dashFrom=now.getFullYear()+'-'+(now.getMonth()+1<10?'0':'')+(now.getMonth()+1)+'-01';_dashTo=today();}
  else if(r==='quarter'){var q=Math.floor(now.getMonth()/3);_dashFrom=new Date(now.getFullYear(),q*3,1).toISOString().slice(0,10);_dashTo=today();}
  else if(r==='year'){_dashFrom=now.getFullYear()+'-01-01';_dashTo=today();}
  else{_dashFrom='';_dashTo='';}
  renderContent();
}

/* Category manager */
function addCat(type){
  var inp=document.getElementById('newCat_'+type);if(!inp)return;
  var name=inp.value.trim();if(!name){showToast('Enter category name','warn');return;}
  if(type==='income'){if(!state.settings.incomeCats)state.settings.incomeCats=incCats().slice();if(!state.settings.incomeCats.includes(name))state.settings.incomeCats.push(name);}
  else{if(!state.settings.expenseCats)state.settings.expenseCats=expCats().slice();if(!state.settings.expenseCats.includes(name))state.settings.expenseCats.push(name);}
  inp.value='';commit();showToast('Category added','success');
  var el=document.getElementById('catList_'+type);if(el)el.innerHTML=renderCatList(type);
}
function removeCat(type,idx){
  if(type==='income'){var c=incCats().slice();c.splice(idx,1);state.settings.incomeCats=c;}
  else{var c2=expCats().slice();c2.splice(idx,1);state.settings.expenseCats=c2;}
  commit();showToast('Removed','success');
  var el=document.getElementById('catList_'+type);if(el)el.innerHTML=renderCatList(type);

/* checkReconciliation */
function checkReconciliation(){
  var cashIn=state.payments.filter(function(p){return p.direction==='in'&&p.method==='cash';}).reduce(function(s,p){return s+p.amount;},0);
  var cashOut=state.payments.filter(function(p){return p.direction==='out'&&p.method==='cash';}).reduce(function(s,p){return s+p.amount;},0);
  var ledIn=state.ledger.filter(function(l){return l.type==='income'&&!l.isTransfer&&l.method==='cash';}).reduce(function(s,l){return s+l.amount;},0);
  var ledOut=state.ledger.filter(function(l){return l.type==='expense'&&!l.isTransfer&&l.method==='cash';}).reduce(function(s,l){return s+l.amount;},0);
  var netCash=(cashIn-cashOut)+(ledIn-ledOut);
  var b='<div style="background:var(--surface2);padding:14px;border-radius:8px;">'
    +'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span style="color:var(--dim);">Cash receipts (payments)</span><span class="tone-good">'+fmt(cashIn)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);"><span style="color:var(--dim);">Cash outflows (payments)</span><span class="tone-bad">'+fmt(cashOut)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span style="color:var(--dim);">Cash income (ledger)</span><span class="tone-good">'+fmt(ledIn)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);"><span style="color:var(--dim);">Cash expenses (ledger)</span><span class="tone-bad">'+fmt(ledOut)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:10px 0;font-size:15px;font-weight:700;"><span>Net cash balance</span><span style="color:'+(netCash>=0?'var(--good)':'var(--danger)')+'">'+fmt(netCash)+'</span></div>'

/* ── Missing export functions (CSV download) ── */
function _downloadCSV(filename, rows, cols){
  if(!rows.length){showToast('No data to export','warn');return;}
  var header=cols.map(function(c){return'"'+c+'"';}).join(',');
  var body=rows.map(function(r){return cols.map(function(c){var v=r[c]!==undefined?String(r[c]):'';return'"'+v.replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([header+'\n'+body],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=filename+'-'+today()+'.csv';a.click();URL.revokeObjectURL(url);
  showToast('Exported '+rows.length+' rows','success');
}

function restoreBackup(input){
  if(!input.files||!input.files[0])return;
  confirmDo('Restore backup','This will replace ALL current data with the backup. Are you sure?',function(){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=JSON.parse(e.target.result);
        if(data.state){
          Object.assign(state,data.state);
          save();commit();closeModal();
          showToast('Backup restored successfully','success');
          renderContent();
        } else showToast('Invalid backup file','warn');
      }catch(err){showToast('Could not read backup file','warn');}
    };
    reader.readAsText(input.files[0]);
  },true);
}

  else if(r==='week'){var d=new Date(now);d.setDate(d.getDate()-6);_dashFrom=d.toISOString().slice(0,10);_dashTo=today();}
  else if(r==='month'){_dashFrom=now.getFullYear()+'-'+(now.getMonth()+1<10?'0':'')+(now.getMonth()+1)+'-01';_dashTo=today();}
  else if(r==='quarter'){var q=Math.floor(now.getMonth()/3);_dashFrom=new Date(now.getFullYear(),q*3,1).toISOString().slice(0,10);_dashTo=today();}
  else if(r==='year'){_dashFrom=now.getFullYear()+'-01-01';_dashTo=today();}
  else{_dashFrom='';_dashTo='';}
  // Filter totalIncome/totalExpense using the range
  var origInc=totalIncome,origExp=totalExpense;
  if(_dashFrom){
    window._rangeIncome=state.ledger.filter(function(l){return l.type==='income'&&!l.isTransfer&&l.date>=_dashFrom&&l.date<=_dashTo;}).reduce(function(s,l){return s+l.amount;},0);
    window._rangeExpense=state.ledger.filter(function(l){return l.type==='expense'&&!l.isTransfer&&l.date>=_dashFrom&&l.date<=_dashTo;}).reduce(function(s,l){return s+l.amount;},0);
  } else {
    window._rangeIncome=null;window._rangeExpense=null;
  }
  renderContent();
};

/* ── 1. ENSURE STATE HAS INVOICES ── */
if(!state.invoices) state.invoices = [];
if(state.settings.invoiceCounter === undefined) state.settings.invoiceCounter = 0;
if(!state.settings.invoicePrefix) state.settings.invoicePrefix = 'INV';
if(!state.settings.receiptPrefix) state.settings.receiptPrefix = 'RCP';

/* ── 2. INVOICE NUMBER GENERATOR ── */
function generateInvoiceNumber(type){
  state.settings.invoiceCounter = (state.settings.invoiceCounter||0) + 1;
  var prefix = type === 'receipt' ? (state.settings.receiptPrefix||'RCP') :
               type === 'purchase' ? 'PO' :
               (state.settings.invoicePrefix||'INV');
  var yr = new Date().getFullYear();
  var n  = String(state.settings.invoiceCounter).padStart(4,'0');
  return prefix + '-' + yr + '-' + n;
}

/* ── 3. CORE INVOICE MODEL ── */
function _makeInvoice(type, data){
  return {
    id:          uid(),
    invoiceNumber: generateInvoiceNumber(type),
    type:        type,          // 'sale' | 'receipt' | 'purchase_payment' | 'manual'
    accountId:   data.accountId || '',
    relatedId:   data.relatedId || '',
    date:        data.date || today(),
    items:       data.items || [],
    subtotal:    data.subtotal || 0,
    vatAmount:   data.vatAmount || 0,
    vatRate:     data.vatRate || 0,
    discount:    data.discount || 0,
    total:       data.total || 0,
    status:      data.status || 'unpaid',  // 'unpaid' | 'partial' | 'paid'
    notes:       data.notes || '',
    createdAt:   new Date().toISOString(),
    createdBy:   (session && session.userName) || 'System'
  };
}

/* ── 4. AUTO-CREATE INVOICE FROM DISPATCH ── */
function createInvoiceFromDispatch(dispatch){
  var sku  = state.skus.find(function(s){ return s.id === dispatch.skuId; }) || {name:'Product', unit:'pkt'};
  var sub  = dispatch.qty * dispatch.rate;
  var vat  = dispatch.vatAmount || 0;
  var disc = dispatch.discount || 0;
  var total = sub + vat - disc;
  var inv = _makeInvoice('sale', {
    accountId:  dispatch.accountId,
    relatedId:  dispatch.id,
    date:       dispatch.date,
    items:      [{ description: sku.name, qty: dispatch.qty, unit: sku.unit||'pkt', rate: dispatch.rate, amount: sub }],
    subtotal:   sub,
    vatAmount:  vat,
    vatRate:    state.settings.vatRate || 13,
    discount:   disc,
    total:      total,
    status:     'unpaid',
    notes:      dispatch.notes || ''
  });
  state.invoices.push(inv);
  return inv;
}

/* ── 5. AUTO-CREATE RECEIPT FROM PAYMENT ── */
function createReceiptFromPayment(payment, direction){
  var acc  = state.accounts.find(function(a){ return a.id === payment.accountId; }) || {name:'Customer'};
  var type = direction === 'in' ? 'receipt' : 'purchase_payment';
  var inv = _makeInvoice(type, {
    accountId:  payment.accountId,
    relatedId:  payment.id,
    date:       payment.date,
    items:      [{ description: direction==='in'?'Payment received from '+acc.name:'Payment made to '+acc.name, qty:1, rate:payment.amount, amount:payment.amount }],
    subtotal:   payment.amount,
    total:      payment.amount,
    status:     'paid',
    notes:      payment.note || ''
  });
  state.invoices.push(inv);
  return inv;
}

  var rows = document.querySelectorAll('#invItemsWrap .inv-item-row');

  rows.forEach(function(row){
    var skuSel = row.querySelector('[data-role=inv-sku]');
    var qty = Number(row.querySelector('[data-role=inv-qty]').value)||0;
    var rate = Number(row.querySelector('[data-role=inv-rate]').value)||0;
    var amt = qty*rate;

    if(qty&&rate){ items.push({description:name,qty:qty,unit:'pkt',rate:rate,amount:amt}); sub+=amt; }
  });
  if(!items.length){ showToast('Add at least one item','warn'); return; }
  var disc = Number(val('inv_disc'))||0;
  var vatEl = document.getElementById('inv_vat');
  var vatAmt = vatEl&&vatEl.checked?Math.round(sub*(state.settings.vatRate||13)/100):0;
  var total = sub+vatAmt-disc;
  if(!state.invoices) state.invoices=[];
  var inv = _makeInvoice('manual',{
    accountId:accId, date:val('inv_date')||today(), items:items,
    subtotal:sub, vatAmount:vatAmt, vatRate:state.settings.vatRate||13,
    discount:disc, total:total, status:'unpaid', notes:val('inv_notes')||''
  });
  state.invoices.push(inv);
  commit();
  showToast('Invoice '+inv.invoiceNumber+' saved','success');

  confirmDo('Delete invoice','Delete this invoice/receipt? Cannot be undone.',function(){
    state.invoices=(state.invoices||[]).filter(function(i){return i.id!==id;});
    commit();showToast('Deleted','success');
  },true);
}
function shareInvoiceWA(invoiceId){
  var inv=(state.invoices||[]).find(function(x){return x.id===invoiceId;});if(!inv)return;
  var acc=state.accounts.find(function(a){return a.id===inv.accountId;})||{name:'Customer',phone:''};
  var isRec=inv.type==='receipt'||inv.type==='purchase_payment';
  var msg='*'+_biz().name+'*\n'+(isRec?'Payment Receipt':'Tax Invoice')+' #'+inv.invoiceNumber+'\n'
    +'Date: '+fmtDate(inv.date)+'\nTo: '+acc.name+'\n\n'
    +(inv.items||[]).map(function(it){return it.description+' × '+it.qty+' @ '+fmt(it.rate)+' = '+fmt(it.amount);}).join('\n')
    +'\n'+(inv.discount?'Discount: − '+fmt(inv.discount)+'\n':'')
    +(inv.vatAmount?'VAT: '+fmt(inv.vatAmount)+'\n':'')
    +'*Total: NPR '+fmt(inv.total)+'*'
    +(inv.notes?'\n\n'+inv.notes:'')
    +'\n\nThank you!';
  var phone=(acc.phone||'').replace(/[^0-9]/g,'');
  window.open('https://wa.me/'+(phone?'977'+phone:'')+'?text='+encodeURIComponent(msg),'_blank');
}

/* ── 11. BILLING TAB RENDERER ── */
function renderBilling(){
  var invs = (state.invoices||[]);
  var filt = ui.billingFilter||'all';
  var srch = (ui.billingSearch||'').toLowerCase();
  var from = ui.billingFrom||'';
  var to   = ui.billingTo||'';

  var filtered = invs.filter(function(i){
    if(filt!=='all'&&filt!=='export'){
      if(filt==='unpaid'&&i.status!=='unpaid') return false;
      if(filt==='paid'&&i.status!=='paid') return false;
      if(filt==='sale'&&i.type!=='sale'&&i.type!=='manual') return false;
      if(filt==='receipt'&&i.type!=='receipt'&&i.type!=='purchase_payment') return false;
    }
    if(from&&i.date<from) return false;
    if(to&&i.date>to) return false;
    if(srch){
      var acc=state.accounts.find(function(a){return a.id===i.accountId;})||{name:''};
      if(!(i.invoiceNumber+acc.name+(i.notes||'')).toLowerCase().includes(srch)) return false;
    }
    return true;
  }).sort(function(a,b){return(b.date||'').localeCompare(a.date||'')||b.createdAt.localeCompare(a.createdAt);});

  var totalAmt = filtered.reduce(function(s,i){return s+i.total;},0);
  var unpaidAmt = filtered.filter(function(i){return i.status==='unpaid';}).reduce(function(s,i){return s+i.total;},0);
  var paidAmt = filtered.filter(function(i){return i.status==='paid';}).reduce(function(s,i){return s+i.total;},0);

  var addBtn = can('accounts.write')
    ? '<div class="flex gap-2"><button class="btn btn-accent" onclick="openManualInvoiceForm(\'\')">'+ic('plus',15)+' New Invoice</button><button class="btn btn-outline" onclick="exportInvoicesCSV()">⬇ Export CSV</button></div>'
    : '';
  var h = sectionHead('Billing & Invoices','All invoices, receipts, and payment records.', addBtn);

  // Summary cards
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px;">';
  h += _billingCard('Total Billed',fmt(totalAmt),'var(--accent)');
  h += _billingCard('Collected',fmt(paidAmt),'var(--good)');
  h += _billingCard('Outstanding',fmt(unpaidAmt),'var(--danger)');
  h += _billingCard('Total Records',filtered.length,'var(--text)');
  h += '</div>';

  // Filters
  h += '<div class="card pad" style="margin-bottom:12px;"><div class="flex wrap gap-2">';
  var filters=[['all','All'],['sale','Invoices'],['receipt','Receipts'],['unpaid','Unpaid'],['paid','Paid']];
  filters.forEach(function(f){
    h+='<button class="btn btn-sm '+(filt===f[0]?'btn-accent':'btn-outline')+'" onclick="ui.billingFilter=\''+f[0]+'\';renderContent()">'+f[1]+'</button>';
  });
  h += '</div><div class="flex wrap gap-2" style="margin-top:8px;">';
  h += '<input class="input" style="max-width:140px;" type="date" value="'+from+'" oninput="ui.billingFrom=this.value;renderContent()">';
  h += '<input class="input" style="max-width:140px;" type="date" value="'+to+'" oninput="ui.billingTo=this.value;renderContent()">';
  h += '<input class="input" style="flex:1;min-width:160px;" placeholder="Search invoice #, account…" value="'+esc(srch)+'" oninput="ui.billingSearch=this.value;renderContent()">';
  h += (from||to||srch?'<button class="btn btn-ghost btn-sm" onclick="ui.billingFrom=\'\';ui.billingTo=\'\';ui.billingSearch=\'\';renderContent()">Clear</button>':'');
  h += '</div></div>';

  if(!filtered.length) return h + emptyStateHtml('No invoices yet. Invoices are created automatically when you dispatch products or receive payments.');

  // Table
  h += '<div class="card" style="overflow-x:auto;"><table style="min-width:620px;width:100%;border-collapse:collapse;">';
  h += '<thead><tr style="background:var(--surface2);">';
  h += '<th style="text-align:left;padding:8px 10px;font-size:12px;">Invoice #</th>';
  h += '<th style="text-align:left;padding:8px 10px;font-size:12px;">Date</th>';
  h += '<th style="text-align:left;padding:8px 10px;font-size:12px;">Account</th>';
  h += '<th style="text-align:left;padding:8px 10px;font-size:12px;">Type</th>';
  h += '<th style="text-align:right;padding:8px 10px;font-size:12px;">Amount</th>';
  h += '<th style="text-align:center;padding:8px 10px;font-size:12px;">Status</th>';
  h += '<th style="text-align:right;padding:8px 10px;font-size:12px;width:120px;">Actions</th>';
  h += '</tr></thead><tbody>';

  filtered.forEach(function(inv){
    var acc=state.accounts.find(function(a){return a.id===inv.accountId;})||{name:'—'};
    var isRec=inv.type==='receipt'||inv.type==='purchase_payment';
    var stColor=inv.status==='paid'?'var(--good)':inv.status==='partial'?'var(--warn)':'var(--danger)';
    var stBg=inv.status==='paid'?'var(--good-dim)':inv.status==='partial'?'var(--warn-dim)':'var(--danger-dim)';
    h += '<tr style="border-bottom:1px solid var(--border);">';
    h += '<td style="padding:8px 10px;font-weight:700;font-size:13px;font-family:monospace;">'+esc(inv.invoiceNumber)+'</td>';
    h += '<td style="padding:8px 10px;font-size:12.5px;white-space:nowrap;">'+fmtDate(inv.date)+'</td>';
    h += '<td style="padding:8px 10px;font-size:13px;font-weight:600;">'+esc(acc.name)+'</td>';
    h += '<td style="padding:8px 10px;"><span style="font-size:11px;background:var(--surface2);border-radius:4px;padding:2px 8px;">'+(isRec?'Receipt':'Invoice')+'</span></td>';
    h += '<td style="padding:8px 10px;text-align:right;font-weight:700;font-size:13px;font-family:monospace;">'+fmt(inv.total)+'</td>';
    h += '<td style="padding:8px 10px;text-align:center;"><span style="font-size:11px;font-weight:700;background:'+stBg+';color:'+stColor+';border-radius:100px;padding:2px 10px;">'+(inv.status||'unpaid').toUpperCase()+'</span></td>';
    h += '<td style="padding:8px 10px;text-align:right;white-space:nowrap;">'
      +'<button class="btn btn-accent btn-sm" onclick="printInvoiceById(\''+inv.id+'\')" title="Print">🖨</button> '
      +'<button class="btn btn-outline btn-sm" onclick="openInvoiceDetail(\''+inv.id+'\')" title="View">👁</button> '
      +(inv.status!=='paid'?'<button class="btn btn-outline btn-sm" onclick="markInvoicePaid(\''+inv.id+'\')" title="Mark paid">✓</button>':'')
      +'</td>';
    h += '</tr>';
  });
  h += '<tr style="background:var(--surface2);font-weight:700;border-top:2px solid var(--border2);">';
  h += '<td colspan="4" style="padding:8px 10px;font-size:13px;">'+filtered.length+' records</td>';
  h += '<td style="padding:8px 10px;text-align:right;font-size:13px;">'+fmt(totalAmt)+'</td>';
  h += '<td colspan="2" style="padding:8px 10px;text-align:center;font-size:12px;color:var(--danger);">Unpaid: '+fmt(unpaidAmt)+'</td>';
  h += '</tr>';
  h += '</tbody></table></div>';
  return h;
}

function _billingCard(label, value, color){
  return '<div class="card pad" style="text-align:center;">'
    +'<div style="font-size:11px;color:var(--dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;">'+label+'</div>'
    +'<div style="font-size:18px;font-weight:800;color:'+color+';">'+value+'</div>'
    +'</div>';
}

function exportInvoicesCSV(){
  var invs=(state.invoices||[]);
  _downloadCSV('invoices', invs.map(function(i){
    var acc=state.accounts.find(function(a){return a.id===i.accountId;})||{name:''};
    return{InvoiceNo:i.invoiceNumber,Type:i.type,Date:i.date,Account:acc.name,Subtotal:i.subtotal||0,Discount:i.discount||0,VAT:i.vatAmount||0,Total:i.total||0,Status:i.status||'unpaid',Notes:i.notes||''};
  }),['InvoiceNo','Type','Date','Account','Subtotal','Discount','VAT','Total','Status','Notes']);
}

/* ── 12. WIRE BILLING INTO NAV ── */
(function(){
  // Patch NAV to add Billing tab (insert after accounts)
  if(typeof NAV !== 'undefined' && !NAV.find(function(n){return n.id==='billing';})){
    var accIdx = NAV.findIndex(function(n){return n.id==='accounts';});
    if(accIdx>=0) NAV.splice(accIdx+1, 0, {id:'billing',label:'Billing',icon:'filetext'});
    else NAV.push({id:'billing',label:'Billing',icon:'filetext'});
  }
  // Patch renderContent to handle billing tab
  var _origRC2 = renderContent;
  if(!renderContent._billingPatched){
    renderContent = function(){
      if(ui && ui.tab==='billing'){
        var el=byId('content');
        if(el) el.innerHTML = renderBilling();
        return;
      }
      _origRC2.apply(this, arguments);
    };
    renderContent._billingPatched = true;
  }
  // Patch renderShell to rebuild nav with billing tab
  var _origRS = typeof renderShell==='function'?renderShell:null;
  if(_origRS && !_origRS._billingPatched){
    renderShell = function(){
      _origRS.apply(this, arguments);
      // Add billing nav item if missing
      setTimeout(function(){
        var nav = document.querySelector('.bottom-nav,nav,[class*="nav-bar"]');
        if(nav && !nav.querySelector('[data-tab="billing"]')){
          var li = document.createElement('button');
          li.className = 'nav-btn';
          li.dataset.tab = 'billing';
          li.innerHTML = ic('filetext',20)+'<span style="font-size:10px;display:block;">Billing</span>';
          li.onclick = function(){ ui.tab='billing'; renderShell(); renderContent(); };
          nav.appendChild(li);
        }
      }, 200);
    };
    renderShell._billingPatched = true;
  }
})();

/* ── 13. ADD BILLING QUICK-ACCESS BUTTONS TO ACCOUNT DETAIL ── */
var _origOAD3 = openAccountDetail;
if(_origOAD3 && !_origOAD3._billingPatched){
  openAccountDetail = function(accountId){
    _origOAD3(accountId);
    setTimeout(function(){
      var mRoot = document.getElementById('modalRoot');if(!mRoot)return;
      if(mRoot.querySelector('.billing-inv-btn'))return;

      invBtn.onclick = function(){ closeModal(); setTimeout(function(){ openManualInvoiceForm(accountId); }, 100); };
      actArea.appendChild(invBtn);
      // Show invoice count
      var count = (state.invoices||[]).filter(function(i){return i.accountId===accountId;}).length;
      if(count > 0){
        var countEl = document.createElement('div');
        countEl.style.cssText='font-size:12px;color:var(--dim);margin-top:6px;';
        countEl.innerHTML = '<b>'+count+'</b> invoice'+(count>1?'s':'')+' on file — <button class="btn-link" onclick="ui.billingFilter=\'all\';ui.billingSearch=\''+esc(state.accounts.find(function(a){return a.id===accountId;})||{name:''}).name+'\';ui.tab=\'billing\';closeModal();renderShell();renderContent();" style="color:var(--accent);background:none;border:none;cursor:pointer;padding:0;font-size:12px;">View all</button>';
        actArea.appendChild(countEl);
      }
    }, 150);
  };
  openAccountDetail._billingPatched = true;
}

/* ══ 14. FULL ANALYTICS DOWNLOAD SUITE ══ */

function openAnalyticsDownloader(){
  var b = '<p style="font-size:13px;color:var(--dim);margin-bottom:16px;">Download any dataset as CSV for Excel or Google Sheets analysis.</p>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">'
    + _dlBtn('📄 All Invoices & Receipts','exportInvoicesCSV()')
    + _dlBtn('📦 All Dispatches','exportDispatches()')
    + _dlBtn('💰 All Payments','exportPayments()')
    + _dlBtn('📒 Full Ledger','exportLedger()')
    + _dlBtn('🏭 Raw Material Purchases','exportPurchases()')
    + _dlBtn('👥 Team & Wages','exportTeam()')
    + _dlBtn('📊 Monthly P&L Summary','exportMonthlyPL()')
    + _dlBtn('🏪 Account-wise Summary','exportAccountSummary()')
    + _dlBtn('📈 Product-wise Sales','exportProductSales()')
    + _dlBtn('🏭 Batch Production Log','exportBatches()')
    + _dlBtn('📉 Material Consumption','exportMaterialConsumption()')
    + _dlBtn('⚡ Full Data Backup (JSON)','downloadBackupNow()')
    + '</div>';
  openModal(modalShell('📥 Analytics & Data Export', b));
}
function _dlBtn(label, fn){
  return '<button class="btn btn-outline" style="text-align:left;padding:10px 14px;display:flex;align-items:center;gap:8px;" onclick="'+fn+';showToast(\'Downloading...\',\'success\')">'
    + '<span style="font-size:18px;">⬇</span><span style="font-size:13px;font-weight:600;">'+label+'</span></button>';
}

function exportMonthlyPL(){
  var months={};
  state.ledger.forEach(function(l){
    if(!l.date) return;
    var mo=l.date.slice(0,7);
    if(!months[mo])months[mo]={month:mo,income:0,expense:0,profit:0};
    if(l.type==='income'&&!l.isTransfer)months[mo].income+=l.amount;
    if(l.type==='expense'&&!l.isTransfer)months[mo].expense+=l.amount;
  });
  Object.keys(months).forEach(function(k){months[k].profit=months[k].income-months[k].expense;});
  var rows=Object.keys(months).sort().map(function(k){return months[k];});
  _downloadCSV('monthly-pl',rows,['month','income','expense','profit']);
}

function exportAccountSummary(){
  var rows=state.accounts.map(function(a){
    var totalDisp=state.dispatches.filter(function(d){return d.accountId===a.id;}).reduce(function(s,d){return s+d.qty*d.rate+(d.vatAmount||0)-(d.discount||0);},0);
    var totalPaid=state.payments.filter(function(p){return p.accountId===a.id&&p.direction==='in';}).reduce(function(s,p){return s+p.amount;},0);
    var outstand=totalDisp-totalPaid;
    var dispCount=state.dispatches.filter(function(d){return d.accountId===a.id;}).length;
    return{Name:a.name,Type:a.type||'',Phone:a.phone||'',Address:a.address||'',TotalSales:totalDisp,TotalPaid:totalPaid,Outstanding:outstand,DispatchCount:dispCount,CreditLimit:a.creditLimit||0};
  });
  _downloadCSV('accounts-summary',rows,['Name','Type','Phone','Address','TotalSales','TotalPaid','Outstanding','DispatchCount','CreditLimit']);
}

function exportProductSales(){
  var rows=state.skus.map(function(s){
    var disps=state.dispatches.filter(function(d){return d.skuId===s.id;});
    var totalQty=disps.reduce(function(t,d){return t+d.qty;},0);
    var totalRev=disps.reduce(function(t,d){return t+d.qty*d.rate;},0);
    var avgRate=totalQty?Math.round(totalRev/totalQty):0;
    var totalCost=totalQty*(s.costPrice||0);
    var grossProfit=totalRev-totalCost;
    var stock=finishedStock(s.id);
    return{Product:s.name,Unit:s.unit||'pkt',SellingPrice:s.sellingPrice||0,CostPrice:s.costPrice||0,TotalQtySold:totalQty,TotalRevenue:totalRev,AvgRate:avgRate,TotalCost:totalCost,GrossProfit:grossProfit,CurrentStock:stock,DispatchCount:disps.length};
  });
  _downloadCSV('product-sales',rows,['Product','Unit','SellingPrice','CostPrice','TotalQtySold','TotalRevenue','AvgRate','TotalCost','GrossProfit','CurrentStock','DispatchCount']);
}

function exportBatches(){
  var rows=state.batches.map(function(b){
    var sk=state.skus.find(function(s){return s.id===b.skuId;})||{name:'?'};
    var mats=(b.materialsUsed||[]).map(function(mu){var m=state.rawMaterials.find(function(x){return x.id===mu.materialId;})||{name:'?'};return m.name+':'+mu.qty;}).join(' | ');
    return{Date:b.date,BatchNo:b.batchNumber||'',Product:sk.name,OutputQty:b.outputQty||0,WastageQty:b.wastageQty||0,InputKg:b.inputKg||0,MaterialsUsed:mats,Notes:b.notes||''};
  });
  _downloadCSV('batches',rows,['Date','BatchNo','Product','OutputQty','WastageQty','InputKg','MaterialsUsed','Notes']);
}

function exportMaterialConsumption(){
  var cons={};
  state.batches.forEach(function(b){
    (b.materialsUsed||[]).forEach(function(mu){
      var mat=state.rawMaterials.find(function(m){return m.id===mu.materialId;})||{name:'?',unit:'kg'};
      var key=mat.name;
      if(!cons[key])cons[key]={Material:key,Unit:mat.unit||'kg',TotalUsed:0,Batches:0};
      cons[key].TotalUsed+=mu.qty;cons[key].Batches++;
    });
  });
  var rows=Object.values(cons);
  _downloadCSV('material-consumption',rows,['Material','Unit','TotalUsed','Batches']);
}

/* ── 15. WIRE ANALYTICS INTO REPORTS TAB ── */
var _origRR = typeof renderReports==='function'?renderReports:null;
if(_origRR && !_origRR._analyticsPatched){
  renderReports = function(){
    var h = _origRR.apply(this,arguments)||'';
    // Add analytics download section at top
    var analyticsBlock = '<div class="card pad" style="margin-bottom:14px;border:2px solid var(--accent);"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;"><div><p style="font-weight:700;font-size:15px;margin:0 0 4px;color:var(--accent);">📥 Analytics & Data Export</p><p style="font-size:12.5px;color:var(--dim);margin:0;">Download any dataset as CSV for Excel / Google Sheets</p></div><button class="btn btn-accent" onclick="openAnalyticsDownloader()">Open Export Centre</button></div></div>';
    return analyticsBlock + h;
  };
  renderReports._analyticsPatched = true;
}

/* ── 16. PRINT INVOICE DIRECTLY FROM DISPATCH ROW ── */
function printDispatchInvoice(dispatchId){
  // Find existing invoice or create one
  var inv=(state.invoices||[]).find(function(i){return i.relatedId===dispatchId;});
  if(inv){ printInvoiceById(inv.id); return; }
  // Create on the fly
  var d=state.dispatches.find(function(x){return x.id===dispatchId;});
  if(!d){ showToast('Dispatch not found','warn'); return; }
  inv=createInvoiceFromDispatch(d);
  commit();
  printInvoiceById(inv.id);
}

/* ── 17. FINAL STATE SYNC ── */
setTimeout(function(){
  if(!state.invoices) state.invoices=[];
  if(state.settings.invoiceCounter===undefined) state.settings.invoiceCounter=0;
  save();
}, 300);
