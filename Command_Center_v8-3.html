<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ARNAMA CEO">
<meta name="theme-color" content="#171412">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>CEO Command Center</title>
<style>

/* ── Typography ── */
*,*::before,*::after{box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}

/* ── CSS Variables — Light Theme ── */
:root{
  --bg:#f5f4f2; --surface:#ffffff; --surface2:#fafaf9;
  --border:#e7e5e2; --border2:#d4d0cb;
  --text:#1c1a17; --text2:#44403c; --dim:#78716c; --dimmer:#a8a29e;
  --accent:#d97706; --accent-dim:#fef3c7; --accent-ink:#ffffff;
  --danger:#dc2626; --danger-dim:#fee2e2;
  --good:#059669; --good-dim:#d1fae5;
  --warn:#b45309; --warn-dim:#fef3c7;
  --info:#0284c7; --info-dim:#e0f2fe;
  --sidebar:#171412; --sidebar2:#1e1b17; --sidebar-text:#d6d3d1; --sidebar-dim:#78716c;
  --radius:10px; --radius-sm:6px; --radius-lg:14px;
  --shadow:0 1px 4px rgba(0,0,0,.08); --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --transition:150ms ease;
}

/* ── Dark Theme ── */
[data-theme="dark"]{
  --bg:#0f0d0b; --surface:#1a1714; --surface2:#211e1a;
  --border:#2c2925; --border2:#3a3530;
  --text:#f0ece6; --text2:#d6d1cb; --dim:#8a8480; --dimmer:#5a5650;
  --accent:#f59e0b; --accent-dim:#2d2108; --accent-ink:#0f0d0b;
  --danger:#f87171; --danger-dim:#2d1414;
  --good:#34d399; --good-dim:#052e1c;
  --warn:#fbbf24; --warn-dim:#2d1d04;
  --info:#38bdf8; --info-dim:#041d2d;
  --sidebar:#0f0d0b; --sidebar2:#171412; --sidebar-text:#c4bfb9; --sidebar-dim:#5a5650;
  --shadow:0 1px 4px rgba(0,0,0,.3); --shadow-md:0 4px 20px rgba(0,0,0,.4);
}

/* ── Base ── */
body{background:var(--bg);color:var(--text);transition:background var(--transition),color var(--transition);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.input,.select,.textarea{background:var(--surface);border:1.5px solid var(--border);color:var(--text);transition:border-color var(--transition);}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none;}
table{color:var(--text);}
th{background:var(--surface2);color:var(--dim);border-bottom:2px solid var(--border);}
td{border-bottom:1px solid var(--border);}
tr:hover td{background:var(--surface2);}

/* ── Toast Notifications ── */
.toast-stack{position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:340px;}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 14px 11px 12px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:9px;
  box-shadow:var(--shadow-md);
  opacity:0;transform:translateX(20px);
  transition:opacity .25s,transform .25s;pointer-events:auto;}
.toast.in{opacity:1;transform:none;}
.toast.out{opacity:0;transform:translateX(20px);}
.toast-bar{width:3px;height:32px;border-radius:3px;flex-shrink:0;}
.toast-success .toast-bar{background:var(--good);}
.toast-error .toast-bar{background:var(--danger);}
.toast-warn .toast-bar{background:var(--warn);}
.toast-info .toast-bar{background:var(--info);}
.toast-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--dim);font-size:16px;padding:0 2px;line-height:1;}

/* ── Confirm Modal ── */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:88888;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s;}
.confirm-box{background:var(--surface);border-radius:var(--radius-lg);padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:slideUp .2s;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* ── Tab transition ── */
.content{animation:tabFade .18s ease;}
@keyframes tabFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Sortable columns ── */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable:hover{color:var(--text);}
th.sortable::after{content:'↕';margin-left:5px;font-size:10px;opacity:.35;}
th.sort-asc::after{content:'↑';opacity:1;color:var(--accent);}
th.sort-desc::after{content:'↓';opacity:1;color:var(--accent);}

/* ── Sticky table headers ── */
.sticky-table thead th{position:sticky;top:0;z-index:5;backdrop-filter:blur(6px);}

/* ── Credit limit bar ── */
.credit-bar{height:6px;border-radius:100px;background:var(--border);overflow:hidden;margin-top:4px;}
.credit-bar-fill{height:100%;border-radius:100px;transition:width .4s;}

/* ── Aging buckets ── */
.aging-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:100px;}
.aging-fresh{background:var(--good-dim);color:var(--good);}
.aging-mild{background:var(--warn-dim);color:var(--warn);}
.aging-old{background:var(--danger-dim);color:var(--danger);}

/* ── Stat card trend ── */
.trend-up{color:var(--good);font-size:11px;font-weight:600;}
.trend-down{color:var(--danger);font-size:11px;font-weight:600;}
.trend-flat{color:var(--dim);font-size:11px;}

/* ── KPI card hover ── */
.stat-card{transition:box-shadow .2s,transform .15s;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}

/* ── Dark mode toggle ── */
.theme-btn{all:unset;cursor:pointer;width:32px;height:32px;border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;color:var(--sidebar-dim);transition:all .2s;}
.theme-btn:hover{background:var(--sidebar2);color:var(--sidebar-text);}

/* ── Mobile bottom sheet ── */
@media(max-width:640px){
  .modal-content{
    position:fixed!important;bottom:0!important;left:0!important;right:0!important;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0!important;
    max-height:90vh;overflow-y:auto;
    animation:slideSheet .25s ease!important;
  }
  @keyframes slideSheet{from{transform:translateY(100%)}to{transform:none}}
}

/* ── Touch targets ── */
.icon-btn{min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);}
.btn-sm{min-height:32px;}

/* ── Invoice print styles ── */
@media print{
  .no-print,aside,.topbar,#modalRoot,.toast-stack{display:none!important;}
  body{background:#fff;color:#000;}
  .main{margin:0!important;padding:0!important;}
  .content{padding:0!important;}
  .print-page{display:block!important;}
}
.print-page{display:none;}

/* ── Overdue badge animation ── */
@keyframes pulse-red{0%,100%{opacity:1}50%{opacity:.6}}
.overdue-pulse{animation:pulse-red 1.8s infinite;}

/* ── Progress rings ── */
.progress-ring{transform:rotate(-90deg);}

/* ── WhatsApp button ── */
.btn-whatsapp{background:#25D366;color:#fff;border:none;}
.btn-whatsapp:hover{background:#1ebe57;}

/* ── Auto-lock overlay ── */
#lockOverlay{position:fixed;inset:0;background:var(--bg);z-index:99990;
  display:none;align-items:center;justify-content:center;}
#lockOverlay.active{display:flex;}

/* ── Bar chart ── */
.bar-group rect{transition:opacity .2s;}
.bar-group:hover rect{opacity:.85;}

/* ── Swipe indicator ── */
.swipe-hint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:5px 12px;border-radius:100px;
  z-index:500;pointer-events:none;opacity:0;transition:opacity .4s;}

/* ── Budget bar ── */
.budget-bar{height:8px;border-radius:100px;background:var(--border);overflow:hidden;margin:4px 0;}
.budget-fill{height:100%;border-radius:100px;}
.budget-ok .budget-fill{background:var(--good);}
.budget-warn .budget-fill{background:var(--warn);}
.budget-over .budget-fill{background:var(--danger);}

/* ── Leave badge ── */
.leave-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.leave-sick{background:#dc2626;}
.leave-casual{background:#d97706;}
.leave-festival{background:#7c3aed;}

/* ── Session log ── */
.session-row{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}

/* ── Reconciliation ── */
.recon-ok{border:2px solid var(--good);border-radius:var(--radius);padding:14px;}
.recon-fail{border:2px solid var(--danger);border-radius:var(--radius);padding:14px;}

/* ── Yield badge ── */
.yield-high{color:var(--good);font-weight:700;}
.yield-low{color:var(--danger);font-weight:700;}

/* ── Recipe card ── */
.recipe-ingredient{display:flex;justify-content:space-between;padding:5px 0;
  border-bottom:1px solid var(--border);font-size:12.5px;}

/* ── Expiry warning ── */
.expiry-soon{background:var(--warn-dim);color:var(--warn);padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;}
.expiry-expired{background:var(--danger-dim);color:var(--danger);padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;}

*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
button,input,select,textarea{font-family:inherit;}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
a{color:inherit;}
/* layout */
.app{display:flex;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;height:100%;width:260px;background:var(--sidebar);color:var(--sidebar-text);
  display:flex;flex-direction:column;z-index:60;transform:translateX(-100%);transition:transform .2s ease;}
.sidebar.open{transform:translateX(0);}
.sidebar-head{display:flex;align-items:center;gap:10px;padding:0 16px;height:64px;border-bottom:1px solid #2b2723;flex-shrink:0;}
.sidebar-head b{color:#fff;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px;}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;background:transparent;color:var(--sidebar-text);
  border-radius:8px;font-size:14px;font-weight:500;text-align:left;cursor:pointer;width:100%;}
.nav button:hover{background:#221e1a;}
.nav button.active{background:var(--accent);color:var(--accent-ink);}
.sidebar-foot{padding:14px 16px;border-top:1px solid #2b2723;font-size:11px;color:#8a8580;flex-shrink:0;}
.sidebar-foot .amt{color:#fff;font-size:16px;display:block;margin-top:2px;}
.overlay-nav{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none;}
.overlay-nav.show{display:block;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:40;flex-shrink:0;}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--dim);padding:6px;display:flex;border-radius:6px;}
.icon-btn:hover{background:#f1f0ee;}
.search-trigger{flex:1;max-width:320px;display:flex;align-items:center;gap:8px;background:#f1f0ee;color:var(--dim);border-radius:8px;padding:8px 12px;font-size:13px;border:none;cursor:pointer;text-align:left;}
.content{flex:1;padding:16px;max-width:1080px;width:100%;margin:0 auto;padding-bottom:60px;}
@media(min-width:900px){
  .sidebar{transform:translateX(0);position:static;flex-shrink:0;}
  .overlay-nav{display:none!important;}
  .hamburger{display:none;}
  .content{padding:24px 28px;}
}
/* atoms */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
.pad{padding:16px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
  cursor:pointer;border:none;white-space:nowrap;}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-primary{background:#171412;color:#fff;}
.btn-accent{background:var(--accent);color:var(--accent-ink);}
.btn-outline{background:#fff;border:1px solid var(--border);color:#374151;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-ghost{background:transparent;color:var(--dim);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn:hover:not(:disabled){filter:brightness(0.96);}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:11.5px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.02em;}
.input,.select,.textarea{border:1px solid var(--border);border-radius:8px;padding:9px 11px;font-size:14px;width:100%;background:#fff;color:var(--text);}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
textarea.textarea{resize:vertical;min-height:60px;}
.grid{display:grid;gap:12px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
.grid-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:720px){.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:460px){.grid-2{grid-template-columns:1fr 1fr;}}
.flex{display:flex;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.wrap{flex-wrap:wrap;}
.badge{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-neutral{background:#f1f0ee;color:#57534e;}
.badge-good{background:#d1fae5;color:#047857;}
.badge-bad{background:#ffedd5;color:#c2410c;}
.badge-warn{background:#fef3c7;color:#92400e;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;color:var(--dim);font-size:11px;font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid #f5f5f4;}
tbody tr:hover{background:#fbfaf9;}
.right{text-align:right;}

.tag-btn.active{background:#171412;color:#fff;}
.stat{padding:14px;}

.stat .val{font-size:20px;font-weight:700;margin-top:6px;}

.alert-row:hover{background:#fafaf9;}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{background:#fff;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;}
@media(min-width:640px){.modal{border-radius:14px;}}
.modal.wide{max-width:680px;}

.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px;}
.toggle2{display:flex;gap:8px;margin-bottom:10px;}
.toggle2 button{flex:1;padding:10px;border-radius:8px;font-size:13.5px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--dim);cursor:pointer;}

.toggle2 button.active-expense{background:#ffedd5;border-color:#ea580c;color:#c2410c;}
.mat-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.mat-row select{flex:1;} .mat-row input{width:80px;}
.chart-wrap svg{width:100%;height:190px;display:block;}
.setup-screen,.lock-screen{min-height:100vh;background:var(--sidebar);display:flex;align-items:center;justify-content:center;padding:20px;}
.setup-card{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:8px;}
.user-avatar{width:44px;height:44px;border-radius:50%;background:#2b2723;color:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
.role-chip{font-size:10px;padding:2px 6px;border-radius:4px;background:#2b2723;color:#f59e0b;font-weight:700;white-space:nowrap;margin-left:4px;}
.user-card-btn{all:unset;cursor:pointer;display:block;width:100%;}
.user-card-btn .card{transition:box-shadow .15s;}
.user-card-btn:hover .card{box-shadow:0 4px 16px rgba(0,0,0,.14);}
.switch-btn{all:unset;cursor:pointer;padding:4px 6px;border-radius:6px;color:#8a8580;display:flex;align-items:center;gap:3px;}
.switch-btn:hover{background:#2b2723;color:#d6d3d1;}
</style>

function load(){
  storageAvailable = testStorage();
  try{
    const raw = storageAvailable ? localStorage.getItem(STORAGE_KEY) : memoryFallback;
    if(raw) state = Object.assign(emptyState(), JSON.parse(raw));
  }catch(e){ /* ignore corrupt data, start fresh */ }
}
function save(){
  const json = JSON.stringify(state);
  memoryFallback = json; // always keep an in-memory copy so the current session never loses data
  if(!storageAvailable) return;
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){ storageAvailable = false; }
}

/* ============================== UTILITIES ============================== */
const uid = () => "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
function fmt(n){
  const v = Number(n)||0; const neg = v<0;
  const s = new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(Math.abs(v));
  return (neg?"-":"")+"Rs "+s;
}
function fmtDate(d){
  if(!d) return "—";
  const dt = new Date(d); if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function sum(arr, fn){ return arr.reduce((s,x)=> s + (Number(fn(x))||0), 0); }
function esc(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function byId(id){ return document.getElementById(id); }
function val(id){ const el = byId(id); return el ? el.value : ""; }
function checked(id){ const el = byId(id); return el ? el.checked : false; }

function toCSV(rows, columns){
  const header = columns.map(c=>'"'+c.label.replace(/"/g,'""')+'"').join(",");
  const body = rows.map(r=> columns.map(c=>{
    let v = c.get(r); if(v===undefined||v===null) v="";
    v = String(v).replace(/"/g,'""');
    return '"'+v+'"';
  }).join(",")).join("\n");
  return header+"\n"+body;
}
function downloadCSV(filename, csv){
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ============================== DERIVED CALCS ============================== */
function cashBalance(){
  const inC = sum(state.ledger.filter(l=>l.type==="income"&&l.method==="cash"), l=>l.amount);
  const outC = sum(state.ledger.filter(l=>l.type==="expense"&&l.method==="cash"), l=>l.amount);
  return (state.settings.startingCash||0) + inC - outC;
}
function bankBalance(){
  const inB = sum(state.ledger.filter(l=>l.type==="income"&&l.method==="bank"), l=>l.amount);
  const outB = sum(state.ledger.filter(l=>l.type==="expense"&&l.method==="bank"), l=>l.amount);
  return (state.settings.startingBank||0) + inB - outB;
}
function totalBalance(){ return cashBalance()+bankBalance(); }
function totalIncome(){ return sum(state.ledger.filter(l=>l.type==="income"), l=>l.amount); }
function totalExpense(){ return sum(state.ledger.filter(l=>l.type==="expense"), l=>l.amount); }

function accountOutstanding(accountId){
  const acc = state.accounts.find(a=>a.id===accountId);
  if(!acc) return 0;
  if(acc.type==="Supplier"){
    const cost = sum(state.materialPurchases.filter(p=>p.supplierAccountId===accountId), p=>(p.qty||0)*(p.costPerUnit||0));
    const paidOut = sum(state.payments.filter(p=>p.accountId===accountId&&p.direction==="out"), p=>p.amount);
    return cost - paidOut;
  }
  const dispatched = sum(state.dispatches.filter(d=>d.accountId===accountId), d=>(d.qty||0)*(d.rate||0));
  const returned = sum(state.returns.filter(r=>r.accountId===accountId), r=>r.value||0);
  const paidIn = sum(state.payments.filter(p=>p.accountId===accountId&&p.direction==="in"), p=>p.amount);
  return dispatched - returned - paidIn;
}
function finishedStock(skuId){
  const produced = sum(state.batches.filter(b=>b.skuId===skuId), b=>b.outputQty||0);
  const dispatched = sum(state.dispatches.filter(d=>d.skuId===skuId), d=>d.qty||0);
  const returned = sum(state.returns.filter(r=>r.skuId===skuId), r=>r.qty||0);
  return produced - dispatched + returned;
}
function materialStock(materialId){
  const purchased = sum(state.materialPurchases.filter(p=>p.materialId===materialId), p=>p.qty||0);
  let used = 0;
  state.batches.forEach(b=> (b.materialsUsed||[]).forEach(m=>{ if(m.materialId===materialId) used += (Number(m.qty)||0); }));
  return purchased - used;
}
function totalReceivable(){ return sum(state.accounts.filter(a=>a.type!=="Supplier"), a=>Math.max(0,accountOutstanding(a.id))); }
function totalPayable(){ return sum(state.accounts.filter(a=>a.type==="Supplier"), a=>Math.max(0,accountOutstanding(a.id))); }
function lowStockMaterials(){ return state.rawMaterials.filter(m=> materialStock(m.id) <= (m.lowStockThreshold||0)); }
function wageDue(teamId){
  const member = state.team.find(t=>t.id===teamId);
  if(!member) return {gross:0,advDue:0,net:0};
  const payHist = state.wagePayments.filter(w=>w.teamId===teamId).sort((a,b)=> a.date<b.date?1:-1);
  const since = payHist[0] ? payHist[0].date : member.joinDate;
  let gross = 0;
  if(member.wageType==="daily"){
    const presentDays = state.attendance.filter(a=>a.teamId===teamId && a.present && a.date>since).length;
    gross = presentDays * (member.wageAmount||0);
  } else { gross = member.wageAmount||0; }
  const advDue = sum(state.advances.filter(a=>a.teamId===teamId && !a.settled), a=>a.amount);
  return {gross, advDue, net: gross-advDue};
}
function computeAlerts(){
  const alerts = [];
  lowStockMaterials().forEach(m=> alerts.push({level:"urgent", text:m.name+" stock is low ("+materialStock(m.id)+" "+m.unit+" left)", tab:"inventory"}));
  state.accounts.forEach(a=>{
    const out = accountOutstanding(a.id);
    if(a.type!=="Supplier" && a.creditLimit && out>a.creditLimit){
      alerts.push({level:"urgent", text:a.name+" owes "+fmt(out)+", over credit limit of "+fmt(a.creditLimit), tab:"accounts"});
    }
    const lastDispatch = state.dispatches.filter(d=>d.accountId===a.id).sort((x,y)=> x.date<y.date?1:-1)[0];
    if(lastDispatch && a.type!=="Supplier" && daysBetween(lastDispatch.date,today())>30){
      alerts.push({level:"info", text:a.name+" hasn't reordered in "+daysBetween(lastDispatch.date,today())+" days", tab:"accounts"});
    }
  });
  state.taxItems.forEach(t=>{
    const d = daysBetween(today(), t.dueDate);
    if(d<=14 && d>=0) alerts.push({level:"warn", text:t.title+" is due "+fmtDate(t.dueDate), tab:"more"});
  });
  if(state.ledger.length>5 && totalBalance() < totalExpense()*0.1){
    alerts.push({level:"urgent", text:"Cash + bank balance is running low ("+fmt(totalBalance())+")", tab:"ledger"});
  }
  return alerts;
}

/* ============================== DASHBOARD ============================== */
function balanceTrendSVG(){
  const sorted = [...state.ledger].sort((a,b)=> a.date<b.date?-1:1);
  let running = (state.settings.startingCash||0)+(state.settings.startingBank||0);
  const pts=[running];
  sorted.forEach(l=>{ running += l.type==="income"? l.amount : -l.amount; pts.push(running); });
  const last = pts.slice(-30);
  if(last.length<2) return '<div class="empty" style="padding:30px 10px;">'+ic('trendUp',22)+'<p>Add a few ledger entries to see your balance trend.</p></div>';
  const w=560,h=170,padX=6,padY=10;
  const min=Math.min(...last), max=Math.max(...last), range=(max-min)||1;
  const stepX=(w-2*padX)/(last.length-1);
  const points = last.map((v,i)=> (padX+i*stepX)+","+(h-padY-((v-min)/range)*(h-2*padY))).join(" ");
  return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+points+'" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
  '</svg></div><div class="flex justify-between" style="font-size:11px;color:var(--dim);"><span>'+fmt(min)+'</span><span>'+fmt(max)+'</span></div>';
}
function expenseBreakdownHTML(){
  const month = today().slice(0,7);
  const exp = state.ledger.filter(l=>l.type==="expense" && l.date.slice(0,7)===month);
  const byCat = {};
  exp.forEach(l=> byCat[l.category]=(byCat[l.category]||0)+l.amount);
  const entries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return emptyStateHtml("No expenses logged this month yet.");
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([cat,v])=>

function exportLedgerCSV(){
  const rows = state.ledger.filter(l=>
    (!ui.ledgerFrom || l.date>=ui.ledgerFrom) && (!ui.ledgerTo || l.date<=ui.ledgerTo) &&
    (ui.ledgerTypeFilter==="all" || l.type===ui.ledgerTypeFilter)
  ).sort((a,b)=> a.date<b.date?1:-1);
  const csv = toCSV(rows,[
    {label:"Date",get:r=>r.date},{label:"Type",get:r=>r.type},{label:"Category",get:r=>r.category},
    {label:"Amount",get:r=>r.amount},{label:"Method",get:r=>r.method},{label:"Note",get:r=>r.note}
  ]);
  downloadCSV("ledger_"+(ui.ledgerFrom||"all")+"_to_"+(ui.ledgerTo||"all")+".csv", csv);

  renderBatchMaterialRows();
}
function removeBatchMaterialRow(i){ batchFormMaterials.splice(i,1); renderBatchMaterialRows(); }
function batchRowMaterial(i,val){ batchFormMaterials[i].materialId = val; renderBatchMaterialRows(); }
function batchRowQty(i,val){ batchFormMaterials[i].qty = val; }
function renderBatchMaterialRows(){
  const el = byId("matRows"); if(!el) return;
  if(state.rawMaterials.length===0){ el.innerHTML = '<p style="font-size:12px;color:#a8a29e;">No raw materials added yet — add some in Inventory first if you want stock deducted automatically.</p>'; return; }

    const avail = mat ? materialStock(mat.id) : 0;
    return '<div class="mat-row">'+
      '<select class="select" onchange="batchRowMaterial('+i+',this.value)">'+state.rawMaterials.map(m=>'<option value="'+m.id+'"'+(m.id===row.materialId?" selected":"")+'>'+esc(m.name)+'</option>').join('')+'</select>'+
      '<input class="input" type="number" placeholder="qty" value="'+row.qty+'" oninput="batchRowQty('+i+',this.value)">'+
      '<span style="font-size:11px;color:#a8a29e;width:90px;flex-shrink:0;">'+(mat?mat.unit:"")+' avail: '+avail+'</span>'+
      '<button class="icon-btn" onclick="removeBatchMaterialRow('+i+')">'+ic('x',14)+'</button>'+

function saveBatchForm(){
  const skuId = val("m_skuId");
  const outputQty = Number(val("m_outputQty"));
  if(!skuId || !outputQty){ alert("Please choose a product and enter finished output."); return; }

  state.batches.push({id:uid(), date:val("m_date")||today(), skuId, inputKg:Number(val("m_inputKg"))||0, outputQty, materialsUsed, notes:val("m_notes")});

}

/* ============================== INVENTORY ============================== */
function renderInventory(){
  let html = sectionHead("Inventory","Raw materials and finished goods, always computed live from purchases, batches, dispatches, and returns.");
  html += '<div class="tag-row">'+
    '<button class="tag-btn '+(ui.invSub==="raw"?"active":"")+'" onclick="ui.invSub=\'raw\';renderContent()">Raw materials</button>'+
    '<button class="tag-btn '+(ui.invSub==="finished"?"active":"")+'" onclick="ui.invSub=\'finished\';renderContent()">Finished goods</button>'+
  '</div>';
  if(ui.invSub==="raw"){
    html += '<div style="margin-bottom:12px;"><button class="btn btn-accent btn-sm" onclick="openMaterialForm()">'+ic('plus',14)+' Add raw material</button></div>';
    if(state.rawMaterials.length===0){ html += '<div class="card">'+emptyStateHtml("No raw materials yet.")+'</div>'; return html; }
    html += '<div class="card" style="overflow-x:auto;"><table style="min-width:520px;"><thead><tr><th>Material</th><th>Unit</th><th class="right">In stock</th><th class="right">Low stock alert</th><th></th></tr></thead><tbody>'+
      state.rawMaterials.map(m=>{
        const stock = materialStock(m.id); const low = stock<=(m.lowStockThreshold||0);
        return '<tr><td style="font-weight:600;">'+esc(m.name)+'</td><td style="color:var(--dim);">'+esc(m.unit)+'</td>'+
          '<td class="right mono '+(low?"tone-bad":"")+'" style="'+(low?"font-weight:700;":"")+'">'+stock+'</td>'+
          '<td class="right mono" style="color:#a8a29e;">'+m.lowStockThreshold+'</td>'+
          '<td class="right"><button class="btn btn-outline btn-sm" onclick="openPurchaseModal(\''+m.id+'\')">Add stock</button> <button class="icon-btn" onclick="delItem(\'rawMaterials\',\''+m.id+'\')">'+ic('trash',14)+'</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  } else {
    if(state.skus.length===0){ html += '<div class="card">'+emptyStateHtml("Add products in SKU Master to see finished stock.")+'</div>'; return html; }
    html += '<div class="card" style="overflow-x:auto;"><table style="min-width:420px;"><thead><tr><th>Product</th><th class="right">Produced</th><th class="right">Dispatched</th><th class="right">In stock</th></tr></thead><tbody>'+
      state.skus.map(s=>{
        const produced = sum(state.batches.filter(b=>b.skuId===s.id), b=>b.outputQty||0);
        const dispatched = sum(state.dispatches.filter(d=>d.skuId===s.id), d=>d.qty||0);
        return '<tr><td style="font-weight:600;">'+esc(s.name)+'</td><td class="right mono">'+produced+'</td><td class="right mono">'+dispatched+'</td><td class="right mono" style="font-weight:700;">'+finishedStock(s.id)+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  return html;
}
function openMaterialForm(){
  const body =
    fieldWrap("Material name",'<input class="input" id="m_name" placeholder="e.g. Turmeric">')+
    fieldWrap("Unit",'<input class="input" id="m_unit" value="kg">')+
    fieldWrap("Low stock alert threshold",'<input class="input" id="m_threshold" type="number" value="0">')+

}
function saveMaterialForm(){
  const name = val("m_name").trim();
  if(!name){ alert("Please enter a material name."); return; }
  state.rawMaterials.push({id:uid(), name, unit:val("m_unit")||"kg", lowStockThreshold:Number(val("m_threshold"))||0});
  closeModal(); commit();
}
function openPurchaseModal(materialId, supplierAccountId){
  const mat = state.rawMaterials.find(m=>m.id===materialId) || state.rawMaterials[0];
  if(!mat){ alert("Add a raw material first."); return; }
  const body =
    '<input type="hidden" id="m_supplierAccountId" value="'+(supplierAccountId||'')+'">'+
    fieldWrap("Material",'<select class="select" id="m_materialId">'+state.rawMaterials.map(m=>'<option value="'+m.id+'"'+(m.id===mat.id?" selected":"")+'>'+esc(m.name)+'</option>').join('')+'</select>')+
    fieldWrap("Date",'<input class="input" id="m_date" type="date" value="'+today()+'">')+
    '<div class="grid grid-2">'+
      fieldWrap("Quantity",'<input class="input" id="m_qty" type="number">')+
      fieldWrap("Cost per unit",'<input class="input" id="m_costPerUnit" type="number">')+
    '</div>'+
    '<p id="purchaseTotal" style="font-size:13px;color:var(--dim);margin:2px 0 10px;">Total cost: <b class="mono">Rs 0</b></p>'+
    fieldWrap("Note",'<input class="input" id="m_note">')+
    (supplierAccountId ? '<label class="flex items-center gap-2" style="font-size:13px;margin-bottom:10px;"><input type="checkbox" id="m_payNow" checked> Paid in full now</label>' : '')+
    fieldWrap("Payment method",'<select class="select" id="m_method"><option value="cash">Cash</option><option value="bank">Bank</option></select>')+
    '<button class="btn btn-accent" style="width:100%;justify-content:center;margin-top:6px;" onclick="savePurchase()">Add stock</button>';
  openModal(modalShell(supplierAccountId?"New purchase":"Add stock — "+mat.name, body));
  ["m_qty","m_costPerUnit"].forEach(id=> byId(id).addEventListener("input", updatePurchaseTotal));
}
function updatePurchaseTotal(){
  const total = (Number(val("m_qty"))||0) * (Number(val("m_costPerUnit"))||0);
  const el = byId("purchaseTotal"); if(el) el.innerHTML = 'Total cost: <b class="mono">'+fmt(total)+'</b>';
}
function savePurchase(){
  const qty = Number(val("m_qty")), cost = Number(val("m_costPerUnit"));
  if(!qty || !cost){ alert("Please enter quantity and cost per unit."); return; }
  const materialId = val("m_materialId");
  const supplierAccountId = val("m_supplierAccountId") || null;
  const date = val("m_date")||today();
  const total = qty*cost;
  const purchaseId = uid();
  state.materialPurchases.push({id:purchaseId, date, materialId, supplierAccountId, qty, costPerUnit:cost, note:val("m_note")});
  const payNow = supplierAccountId ? checked("m_payNow") : true;
  if(payNow){
    const method = val("m_method");
    const mat = state.rawMaterials.find(m=>m.id===materialId);
    if(supplierAccountId){
      state.payments.push({id:"pur_"+purchaseId, accountId:supplierAccountId, date, amount:total, method, direction:"out", note:"Purchase — "+(mat?mat.name:"")});
      state.ledger.push({id:"pur_"+purchaseId, type:"expense", category:"Raw Materials", amount:total, method, date, note:"Bought "+qty+" "+(mat?mat.unit:"")+" "+(mat?mat.name:"")});
    } else {
      state.ledger.push({id:"matbuy_"+purchaseId, type:"expense", category:"Raw Materials", amount:total, method, date, note:"Bought "+qty+" "+(mat?mat.unit:"")+" "+(mat?mat.name:"")});
    }
  }
  closeModal();
  if(supplierAccountId) refreshAccountDetail(supplierAccountId); else commit();
}

function saveAccountForm(){
  const name = val("m_name").trim();
  if(!name){ alert("Please enter a name."); return; }
  state.accounts.push({id:uid(), name, type:val("m_atype"), contact:val("m_contact"), creditLimit:Number(val("m_creditLimit"))||0, notes:val("m_notes"), createdAt:today()});

}
function openAccountDetail(accountId){
  const a = state.accounts.find(x=>x.id===accountId);
  if(!a){ closeModal(); return; }
  const isSup = a.type==="Supplier";
  const out = accountOutstanding(a.id);
  const myDispatches = state.dispatches.filter(d=>d.accountId===a.id).sort((x,y)=> x.date<y.date?1:-1);
  const myPurchases = state.materialPurchases.filter(p=>p.supplierAccountId===a.id).sort((x,y)=> x.date<y.date?1:-1);
  const myPayments = state.payments.filter(p=>p.accountId===a.id).sort((x,y)=> x.date<y.date?1:-1);

  let body = '<div class="flex justify-between items-center wrap gap-2" style="margin-bottom:10px;">'+
      '<div class="flex items-center gap-2">'+badge(a.type)+(a.contact?'<span style="font-size:13px;color:var(--dim);">'+esc(a.contact)+'</span>':'')+'</div>'+
      badge(isSup ? "Payable: "+fmt(Math.max(0,out)) : "Receivable: "+fmt(Math.max(0,out)), out>0?(isSup?"bad":"warn"):"good")+
    '</div>';
  if(a.creditLimit>0 && !isSup) body += '<p style="font-size:12px;color:var(--dim);margin-bottom:8px;">Credit limit: '+fmt(a.creditLimit)+(out>a.creditLimit?' <span style="color:var(--danger);font-weight:600;">— over limit</span>':'')+'</p>';
  if(a.notes) body += '<p style="font-size:13px;color:var(--dim);background:#fafaf9;border-radius:8px;padding:8px;margin-bottom:10px;">'+esc(a.notes)+'</p>';

  body += '<div class="flex wrap gap-2" style="margin-bottom:14px;">'+
    (!isSup ? '<button class="btn btn-accent btn-sm" onclick="openDispatchModal(\''+a.id+'\')">'+ic('truck',14)+' New dispatch</button>' : '<button class="btn btn-accent btn-sm" onclick="openPurchaseModal(null,\''+a.id+'\')">'+ic('boxes',14)+' New purchase</button>')+
    '<button class="btn btn-outline btn-sm" onclick="openPaymentModal(\''+a.id+'\')">'+(isSup?"Record payment made":"Record payment received")+'</button>'+
  '</div>';

  if(!isSup){
    body += '<p style="font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:4px;">DISPATCH HISTORY</p>';
    body += myDispatches.length===0 ? '<p style="font-size:12px;color:#a8a29e;">No dispatches yet.</p>' :
      '<div style="max-height:150px;overflow-y:auto;margin-bottom:12px;">'+myDispatches.map(d=>{
        const sku = state.skus.find(s=>s.id===d.skuId);
        return '<div class="flex justify-between items-center" style="font-size:13px;border-bottom:1px solid #f5f5f4;padding:5px 0;">'+
          '<span>'+fmtDate(d.date)+' — '+esc(sku?sku.name:"")+' x'+d.qty+'</span>'+
          '<span class="flex items-center gap-2"><span class="mono">'+fmt(d.qty*d.rate)+'</span><button class="icon-btn" onclick="delDispatch(\''+d.id+'\',\''+a.id+'\')">'+ic('trash',13)+'</button></span></div>';
      }).join('')+'</div>';
  } else {
    body += '<p style="font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:4px;">PURCHASE HISTORY</p>';
    body += myPurchases.length===0 ? '<p style="font-size:12px;color:#a8a29e;">No purchases yet.</p>' :
      '<div style="max-height:150px;overflow-y:auto;margin-bottom:12px;">'+myPurchases.map(p=>{
        const mat = state.rawMaterials.find(m=>m.id===p.materialId);
        return '<div class="flex justify-between items-center" style="font-size:13px;border-bottom:1px solid #f5f5f4;padding:5px 0;">'+
          '<span>'+fmtDate(p.date)+' — '+esc(mat?mat.name:"")+' x'+p.qty+(mat?mat.unit:"")+'</span>'+
          '<span class="flex items-center gap-2"><span class="mono">'+fmt(p.qty*p.costPerUnit)+'</span><button class="icon-btn" onclick="delPurchase(\''+p.id+'\',\''+a.id+'\')">'+ic('trash',13)+'</button></span></div>';
      }).join('')+'</div>';
  }

  body += '<p style="font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:4px;">PAYMENT HISTORY</p>';
  body += myPayments.length===0 ? '<p style="font-size:12px;color:#a8a29e;">No payments recorded yet.</p>' :
    '<div style="max-height:150px;overflow-y:auto;margin-bottom:10px;">'+myPayments.map(p=>
      '<div class="flex justify-between items-center" style="font-size:13px;border-bottom:1px solid #f5f5f4;padding:5px 0;">'+
        '<span>'+fmtDate(p.date)+' · '+esc(p.method)+'</span>'+
        '<span class="flex items-center gap-2"><span class="mono">'+fmt(p.amount)+'</span><button class="icon-btn" onclick="delPayment(\''+p.id+'\',\''+a.id+'\')">'+ic('trash',13)+'</button></span></div>'
    ).join('')+'</div>';

  body += '<button class="btn btn-danger btn-sm" onclick="delAccount(\''+a.id+'\')">'+ic('trash',13)+' Delete account</button>';
  openModal(modalShell(a.name, body), true);
}
function delDispatch(id, accId){ if(!confirm("Delete this dispatch?")) return; state.dispatches = state.dispatches.filter(x=>x.id!==id); refreshAccountDetail(accId); }
function delPurchase(id, accId){ if(!confirm("Delete this purchase?")) return; state.materialPurchases = state.materialPurchases.filter(x=>x.id!==id); refreshAccountDetail(accId); }
function delPayment(id, accId){
  if(!confirm("Delete this payment? This will also remove its matching ledger entry.")) return;
  state.payments = state.payments.filter(x=>x.id!==id);
  state.ledger = state.ledger.filter(l=> l.id!==("pay_"+id) && l.id!==("pur_"+id));
  refreshAccountDetail(accId);
}
function delAccount(id){
  if(!confirm("Delete this account? Its dispatch/payment history will remain in reports but will no longer be linked to a named account.")) return;
  state.accounts = state.accounts.filter(a=>a.id!==id);
  closeModal(); commit();
}

  const sku0 = state.skus[0];

    '<input type="hidden" id="m_accountId" value="'+accountId+'">'+
    '<input type="hidden" id="m_priceField" value="'+priceField+'">'+

function dispatchSkuChanged(){
  const sku = state.skus.find(s=>s.id===val("m_skuId"));

function updateDispatchTotal(){

function saveDispatch(){
  const qty = Number(val("m_qty")), rate = Number(val("m_rate"));
  if(!qty || !rate){ alert("Please enter quantity and rate."); return; }
  const accountId = val("m_accountId");
  state.dispatches.push({id:uid(), accountId, date:val("m_date")||today(), skuId:val("m_skuId"), qty, rate});

function openPaymentModal(accountId){
  const a = state.accounts.find(x=>x.id===accountId);
  const isSup = a.type==="Supplier";
  const out = accountOutstanding(accountId);
  const body =
    '<input type="hidden" id="m_accountId" value="'+accountId+'">'+
    '<p style="font-size:13px;color:var(--dim);">Current balance: <b class="mono">'+fmt(out)+'</b></p>'+

    fieldWrap("Note",'<input class="input" id="m_note">')+

function savePayment(direction){
  const amount = Number(val("m_amount"));
  if(!amount){ alert("Please enter an amount."); return; }
  const accountId = val("m_accountId");
  const a = state.accounts.find(x=>x.id===accountId);
  const note = val("m_note");
  const date = val("m_date")||today();
  const method = val("m_method");
  const payId = uid();
  state.payments.push({id:payId, accountId, date, amount, method, note, direction});

  ]]);

  ]]);

  sections.push(["ACCOUNTS SUMMARY (not date-filtered)", state.accounts, [

    {label:"Credit Limit",get:r=>r.creditLimit},{label:"Outstanding Balance",get:r=>accountOutstanding(r.id)}

/* --- Goals --- */
function goalProgress(g){
  if(g.metric==="revenue") return sum(state.ledger.filter(l=>l.type==="income"&&l.date>=g.createdAt), l=>l.amount);
  if(g.metric==="units") return sum(state.dispatches.filter(d=>d.date>=g.createdAt), d=>d.qty);
  if(g.metric==="accounts") return state.accounts.filter(a=>a.createdAt>=g.createdAt).length;
  return 0;
}
function renderGoals(){
  let html = '<div style="margin-bottom:12px;"><button class="btn btn-accent btn-sm" onclick="openGoalForm()">'+ic('plus',14)+' Add goal</button></div>';
  if(state.goals.length===0){ html += emptyStateHtml("No goals set yet."); return html; }
  html += '<div class="grid grid-2">'+state.goals.map(g=>{
    const cur = goalProgress(g); const pct = Math.min(100, Math.round((cur/(g.target||1))*100));
    return '<div class="card pad"><div class="flex justify-between items-start">'+
      '<div><div style="font-weight:600;">'+esc(g.title)+'</div><div style="font-size:11.5px;color:#a8a29e;">By '+fmtDate(g.deadline)+'</div></div>'+
      '<button class="icon-btn" onclick="delItem(\'goals\',\''+g.id+'\')">'+ic('trash',14)+'</button></div>'+
      '<div style="background:#f1f0ee;border-radius:999px;height:8px;overflow:hidden;margin-top:10px;"><div style="background:#f59e0b;height:100%;width:'+pct+'%"></div></div>'+
      '<div style="font-size:12px;color:var(--dim);margin-top:5px;">'+(g.metric==="revenue"?fmt(cur):cur)+' of '+(g.metric==="revenue"?fmt(g.target):g.target)+' ('+pct+'%)</div>'+
    '</div>';
  }).join('')+'</div>';
  return html;
}

    fieldWrap("Measured by",'<select class="select" id="m_metric"><option value="revenue">Revenue (NPR)</option><option value="units">Units dispatched</option><option value="accounts">New accounts</option></select>')+

function markTaxDone(id){
  state.taxItems = state.taxItems.map(t=>{
    if(t.id!==id) return t;
    const doneDates = [...(t.doneDates||[]), today()];
    let dueDate = t.dueDate;
    if(t.recurring==="monthly"){ const d=new Date(t.dueDate); d.setMonth(d.getMonth()+1); dueDate=d.toISOString().slice(0,10); }
    if(t.recurring==="yearly"){ const d=new Date(t.dueDate); d.setFullYear(d.getFullYear()+1); dueDate=d.toISOString().slice(0,10); }
    return Object.assign({},t,{doneDates, dueDate});
  });
  commit();
}

function restoreBackup(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{ const parsed = JSON.parse(ev.target.result); state = Object.assign(emptyState(), parsed); save(); boot(); alert("Backup restored successfully."); }
    catch(e){ alert("This file could not be read as a valid backup."); }
  };
  reader.readAsText(file);
}
function runHealthCheck(){
  const found = [];
  state.dispatches.forEach(d=>{
    if(!state.accounts.find(a=>a.id===d.accountId)) found.push("Dispatch on "+d.date+" references a missing account.");
    if(!state.skus.find(s=>s.id===d.skuId)) found.push("Dispatch on "+d.date+" references a missing product.");
  });
  state.batches.forEach(b=>{
    if(!state.skus.find(s=>s.id===b.skuId)) found.push("Batch on "+b.date+" references a missing product.");
    (b.materialsUsed||[]).forEach(m=>{ if(!state.rawMaterials.find(r=>r.id===m.materialId)) found.push("Batch on "+b.date+" references a missing raw material."); });
  });
  state.payments.forEach(p=>{ if(!state.accounts.find(a=>a.id===p.accountId)) found.push("Payment on "+p.date+" references a missing account."); });
  const el = byId("healthResults");
  el.innerHTML = (found.length ? found : ["No issues found. Everything checks out."]).map(f=>'<div>• '+esc(f)+'</div>').join('');
}

function audit(action,detail){
  if(!session.userId) return;
  if(!state.auditLog) state.auditLog=[];
  state.auditLog.push({id:uid(),userId:session.userId,userName:session.userName,
    role:session.role,action:action,detail:detail||"",timestamp:new Date().toISOString()});
  if(state.auditLog.length>500) state.auditLog=state.auditLog.slice(-500);
}

function boot(){
  if(!state.settings.setupDone){ renderSetup(); return; }

function tryMultiLogin(){
  const u=(state.users||[]).find(function(x){return x.id===_pendingUserId;});
  if(!u){ renderUserSelect(); return; }
  const entered=document.getElementById("pin_inp");
  if(!entered||entered.value!==u.pin){
    const errEl=byId("pin_err");
    if(errEl) errEl.textContent="Incorrect PIN. Please try again.";
    if(entered){ entered.value=""; entered.focus(); }
    return;
  }
  session={userId:u.id,userName:u.name,role:u.role,loggedIn:true};
  state.users=(state.users||[]).map(function(x){
    return x.id===u.id?Object.assign({},x,{lastLogin:today()}):x;
  });
  save();
  audit("Login","Logged in");
  _pendingUserId=null;
  renderShell();
}

function renderMiniChart(trend){
  const vals=trend.map(function(t){return t.balance;});
  const max=Math.max.apply(null,vals); const min=Math.min.apply(null,vals); const range=max-min||1;
  const W=400,H=160,pL=60,pR=10,pT=8,pB=24;
  const xs=function(i){return pL+(i/(trend.length-1))*(W-pL-pR);};
  const ys=function(v){return pT+((max-v)/range)*(H-pT-pB);};
  const pts=trend.map(function(t,i){return xs(i)+','+ys(t.balance);}).join(' ');
  const fmtK=function(v){return Math.abs(v)>=100000?'Rs '+(v/100000).toFixed(1)+'L':Math.abs(v)>=1000?'Rs '+(v/1000).toFixed(0)+'K':'Rs '+v;};
  const gridVs=[min,min+range*0.5,max];
  let g='';
  gridVs.forEach(function(v){ g+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+ys(v)+'" y2="'+ys(v)+'" stroke="#f1f0ee" stroke-width="1"/>'; g+='<text x="'+(pL-4)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="9" fill="#a8a29e">'+fmtK(v)+'</text>'; });
  const step=Math.max(1,Math.ceil(trend.length/6));
  let xl='';
  trend.forEach(function(t,i){ if(i%step===0) xl+='<text x="'+xs(i)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="#a8a29e">'+t.date+'</text>'; });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%;">'+g+
    '<path fill="#d97706" fill-opacity="0.07" d="M '+xs(0)+' '+(H-pB)+' '+pts+' '+xs(trend.length-1)+' '+(H-pB)+' Z"/>'+
    '<polyline fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" points="'+pts+'"/>'+xl+'</svg>';
}

function renderDonutChart(data,colors){
  const total=data.reduce(function(s,d){return s+d.value;},0);
  let angle=-Math.PI/2; const cx=80,cy=80,R=65,r=40;
  const slices=data.map(function(d,i){
    if(!d.value) return '';
    const a0=angle; angle+=(d.value/total)*Math.PI*2; const a1=angle;
    const x1=cx+R*Math.cos(a0),y1=cy+R*Math.sin(a0);
    const x2=cx+R*Math.cos(a1),y2=cy+R*Math.sin(a1);
    const ix1=cx+r*Math.cos(a0),iy1=cy+r*Math.sin(a0);
    const ix2=cx+r*Math.cos(a1),iy2=cy+r*Math.sin(a1);
    const lg=d.value/total>0.5?1:0;
    return '<path fill="'+colors[i%colors.length]+'" d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+lg+' 1 '+x2+' '+y2+' L'+ix2+' '+iy2+' A'+r+' '+r+' 0 '+lg+' 0 '+ix1+' '+iy1+'Z"/>';
  }).join('');
  const legend=data.slice(0,6).map(function(d,i){
    return '<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);">'+
      '<div style="width:8px;height:8px;border-radius:2px;background:'+colors[i%colors.length]+';flex-shrink:0;"></div>'+
      '<span style="max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(d.name)+'</span>'+
    '</div>';
  }).join('');
  return '<div style="display:flex;flex-direction:column;align-items:center;height:200px;justify-content:center;gap:8px;">'+
    '<svg viewBox="0 0 160 160" style="width:150px;height:150px;">'+slices+'</svg>'+
    '<div style="display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;">'+legend+'</div>'+
  '</div>';
}

/* ── Override renderReports — add Monthly P&L ── */
function renderMonthlyPL(){
  const monthMap={};
  (state.ledger||[]).forEach(function(l){
    const m=(l.date||"").slice(0,7); if(!m) return;
    if(!monthMap[m]) monthMap[m]={income:0,expense:0};
    if(l.type==="income") monthMap[m].income+=l.amount;
    else monthMap[m].expense+=l.amount;
  });
  const months=Object.keys(monthMap).sort().reverse();
  if(!months.length) return '<p style="font-size:13px;color:#a8a29e;padding:12px 0;">No ledger entries yet. Add income and expense entries to see the monthly P&L here.</p>';
  let html='<div class="card" style="overflow-x:auto;"><table style="min-width:440px;">'+
    '<thead><tr><th>Month</th><th class="right">Revenue</th><th class="right">Expenses</th><th class="right">Net Profit / Loss</th></tr></thead><tbody>';
  months.forEach(function(m){
    const d=monthMap[m]; const net=d.income-d.expense;
    const parts=m.split("-");
    const label=new Date(Number(parts[0]),Number(parts[1])-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
    html+='<tr>'+
      '<td style="font-weight:600;">'+esc(label)+'</td>'+
      '<td class="right mono tone-good">'+fmt(d.income)+'</td>'+
      '<td class="right mono tone-bad">'+fmt(d.expense)+'</td>'+
      '<td class="right mono '+(net>=0?"tone-good":"tone-bad")+'" style="font-weight:700;">'+fmt(net)+'</td>'+
    '</tr>';
  });
  const allNet=totalIncome()-totalExpense();
  html+='<tr style="background:#fafaf9;border-top:2px solid var(--border);">'+
    '<td style="font-weight:700;">All time total</td>'+
    '<td class="right mono tone-good" style="font-weight:700;">'+fmt(totalIncome())+'</td>'+
    '<td class="right mono tone-bad" style="font-weight:700;">'+fmt(totalExpense())+'</td>'+
    '<td class="right mono '+(allNet>=0?"tone-good":"tone-bad")+'" style="font-weight:700;">'+fmt(allNet)+'</td>'+
  '</tr>';
  html+='</tbody></table></div>';
  return html;
}

/* ── Override resetAllData and restoreBackup ── */
function resetAllData(){
  if(!confirm("Permanently erase ALL data including users, ledger, accounts, everything?")) return;
  if(!confirm("Are you absolutely sure? This cannot be undone.")) return;
  state=emptyState();
  session={userId:null,userName:"",role:"ceo",loggedIn:false};
  ui.unlocked=false;
  save(); boot();
}

function restoreBackup(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const parsed=JSON.parse(ev.target.result);
      state=Object.assign(emptyState(),parsed);
      session={userId:null,userName:"",role:"ceo",loggedIn:false};
      ui.unlocked=false;
      save(); boot();
      alert("Backup restored successfully.");
    } catch(e){ alert("Could not read backup file. Make sure it is a valid JSON backup."); }
  };
  reader.readAsText(file);
}

function adToBS(ds){try{var t=new Date(ds+"T00:00:00");var ys=Object.keys(_BSD).map(Number).sort(function(a,b){return b-a;});for(var i=0;i<ys.length;i++){var y=ys[i],d=_BSD[y],sd=new Date(d.s+"T00:00:00");if(t>=sd){var df=Math.floor((t-sd)/86400000),mo=0;while(mo<12&&df>=d.m[mo]){df-=d.m[mo];mo++;}return {y:y,m:mo,d:df+1,mn:_BSM[mo]};}}}catch(e){}return null;}

/* E: TABLE SORT */
var _srtSt={};
function sortCol(tid,col,num){
  var key=tid+":"+col,asc=_srtSt[key]===undefined?true:!_srtSt[key];_srtSt[key]=asc;
  var tbl=document.getElementById(tid);if(!tbl)return;
  tbl.querySelectorAll("th.sortable").forEach(function(th,i){th.classList.remove("sort-asc","sort-desc");if(i===col)th.classList.add(asc?"sort-asc":"sort-desc");});
  var tb=tbl.querySelector("tbody");
  var rows=Array.from(tb.querySelectorAll("tr")).sort(function(a,b){
    var av=(a.cells[col]||{}).innerText||"",bv=(b.cells[col]||{}).innerText||"";
    if(num==="num"){av=parseFloat(av.replace(/[^0-9.-]/g,""))||0;bv=parseFloat(bv.replace(/[^0-9.-]/g,""))||0;return asc?av-bv:bv-av;}
    return asc?av.localeCompare(bv):bv.localeCompare(av);
  });
  rows.forEach(function(r){tb.appendChild(r);});
}

  var ti=monthIncome(0),te=monthExpense(0),li=monthIncome(-1),le=monthExpense(-1);
  var net=totalIncome()-totalExpense(),todayStr=today();
  var todayE=state.ledger.filter(function(l){return l.date===todayStr;});
  var todayIn=todayE.filter(function(l){return l.type==="income";}).reduce(function(s,l){return s+l.amount;},0);
  var todayEx=todayE.filter(function(l){return l.type==="expense";}).reduce(function(s,l){return s+l.amount;},0);
  // Top customers this month
  var mnStart=new Date();mnStart.setDate(1);var mnStartStr=mnStart.toISOString().slice(0,10);
  var custMap={};
  state.dispatches.filter(function(d){return d.date>=mnStartStr;}).forEach(function(d){custMap[d.accountId]=(custMap[d.accountId]||0)+d.qty*d.rate;});
  var topCust=Object.entries(custMap).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  // Top products
  var prodMap={};
  state.dispatches.filter(function(d){return d.date>=mnStartStr;}).forEach(function(d){if(!prodMap[d.skuId])prodMap[d.skuId]={qty:0,rev:0};prodMap[d.skuId].qty+=d.qty;prodMap[d.skuId].rev+=d.qty*d.rate;});
  var topProd=Object.entries(prodMap).sort(function(a,b){return b[1].rev-a[1].rev;}).slice(0,5);
  // Aging
  var aging={fresh:0,mild:0,old:0};
  state.accounts.filter(function(a){return a.type!=="Supplier";}).forEach(function(a){
    var out=accountOutstanding(a.id);if(out<=0)return;
    var ld=state.dispatches.filter(function(d){return d.accountId===a.id;}).sort(function(x,y){return (y.date||"").localeCompare(x.date||"");});
    if(!ld.length)return;var days=daysSince(ld[0].date);
    if(days<=30)aging.fresh+=out;else if(days<=60)aging.mild+=out;else aging.old+=out;
  });
  // Forecast
  var d90=new Date();d90.setDate(d90.getDate()-90);var d90s=d90.toISOString().slice(0,10);
  var r90=state.ledger.filter(function(l){return l.date>=d90s;});
  var avgIn=r90.filter(function(l){return l.type==="income";}).reduce(function(s,l){return s+l.amount;},0)/90;
  var avgEx=r90.filter(function(l){return l.type==="expense";}).reduce(function(s,l){return s+l.amount;},0)/90;
  var f30=(avgIn-avgEx)*30,projBal=totalBalance()+f30;
  // Trend chart data
  var trend=(function(){var es=state.ledger.slice(-40),acc=[],run=totalBalance()-es.reduce(function(s,e){return s+(e.type==="income"?e.amount:-e.amount);},0);es.forEach(function(e){run+=(e.type==="income"?e.amount:-e.amount);acc.push({date:fmtDate(e.date),balance:run});});return acc;})();
  // Cat pie
  var catMap={};
  getMonthEntries(0).filter(function(l){return l.type==="expense";}).forEach(function(l){catMap[l.category]=(catMap[l.category]||0)+l.amount;});
  var catBd=Object.entries(catMap).sort(function(a,b){return b[1]-a[1];}).map(function(e){return{name:e[0],value:e[1]};});
  var COLORS=["#d97706","#059669","#7c3aed","#dc2626","#0284c7","#db2777","#65a30d","#ea580c"];
  // Reminders
  var todayMD=todayStr.slice(5),rems=[];
  state.team.forEach(function(m){
    if(m.birthday&&m.birthday.slice(5)===todayMD)rems.push("🎂 Today is "+m.name+"'s birthday!");
    if(m.joinDate&&m.joinDate.slice(5)===todayMD){var yrs=new Date().getFullYear()-new Date(m.joinDate).getFullYear();if(yrs>0)rems.push("🎉 "+m.name+" completes "+yrs+" year"+(yrs>1?"s":"")+" today!");}
  });
  var bsToday=formatBSDate(todayStr);
  var html='<div class="no-print">';
  // Header
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px;">';
  html+='<div><h1 style="font-size:21px;font-weight:900;margin:0;">'+esc(state.settings.businessName||"Dashboard")+'</h1>';
  html+='<p style="font-size:12px;color:var(--dim);margin:3px 0 0;">'+fmtDate(todayStr)+(bsToday?' &middot; '+bsToday+' BS:':'')+' &middot; '+new Date().toLocaleTimeString("en-NP",{hour:"2-digit",minute:"2-digit"})+'</p></div>';
  html+='<button class="btn btn-outline btn-sm" onclick="copyWhatsAppSummary()">📱 WhatsApp</button></div>';
  // Today card
  if(todayE.length)html+='<div style="background:var(--accent-dim);border:1px solid var(--accent);border-radius:var(--radius);padding:11px 16px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;"><span style="font-size:13px;font-weight:700;color:var(--accent);">📅 Today</span><span style="font-size:13px;color:var(--good);font-weight:600;">+'+fmt(todayIn)+'</span><span style="font-size:13px;color:var(--danger);font-weight:600;">-'+fmt(todayEx)+'</span><span style="font-size:13px;font-weight:700;color:'+(todayIn-todayEx>=0?"var(--good)":"var(--danger)")+'">= '+fmt(todayIn-todayEx)+'</span><span style="font-size:11px;color:var(--dim);">'+todayE.length+' entries</span></div>';
  // Reminders
  rems.forEach(function(r){html+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 14px;margin-bottom:8px;font-size:13px;">'+esc(r)+'</div>';});
  // Backup reminder
  var daysSinceBk=state.settings.lastBackupDate?daysSince(state.settings.lastBackupDate):999;
  if(daysSinceBk>=7)html+='<div style="background:var(--warn-dim);border:1px solid var(--warn);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;"><span style="font-size:13px;color:var(--warn);font-weight:600;">⚠️ Last backup: '+( state.settings.lastBackupDate?daysSinceBk+'d ago':'never')+'</span><button class="btn btn-sm" style="background:var(--warn);color:#fff;" onclick="downloadBackupNow()">Backup now</button></div>';
  // KPI row 1
  html+='<div class="grid grid-4" style="margin-bottom:14px;">';
  html+=statCardPro("wallet","Cash + Bank",fmt(totalBalance()),"Cash "+fmt(cashBalance())+" · Bank "+fmt(bankBalance()),null,null);
  html+=statCardPro("trendUp","Net Profit",fmt(net),"All time",trendArrow(ti-te,li-le),net>=0?"good":"bad");
  html+=statCardPro("trendDown","Receivables",fmt(totalReceivable()),"Owed by customers",trendArrow(totalReceivable(),totalReceivable()),null);
  html+=statCardPro("alert","Alerts",alerts.length,"Active",null,alerts.length?"warn":null);
  html+='</div>';
  // KPI row 2
  html+='<div class="grid grid-4" style="margin-bottom:16px;">';
  html+=statCardPro("trendUp","Month revenue",fmt(ti),"vs last month",trendArrow(ti,li),"good");
  html+=statCardPro("trendDown","Month expense",fmt(te),"vs last month",trendArrow(te,le),"bad");
  html+=statCardPro("trendUp","Payables",fmt(totalPayable()),"Owed to suppliers",null,totalPayable()>0?"bad":null);
  html+=statCardPro("package","Total stock",state.skus.reduce(function(s,k){return s+finishedStock(k.id);},0)+" pkts","Ready to dispatch",null,null);
  html+='</div>';
  // Charts
  html+='<div class="grid grid-2" style="margin-bottom:16px;">';
  html+='<div class="card p-4"><p style="font-weight:700;font-size:13.5px;margin:0 0 10px;">Balance trend</p><div style="height:190px;">'+(trend.length<2?'<p style="color:var(--dim);font-size:13px;text-align:center;padding-top:60px;">Add ledger entries to see trend.</p>':renderMiniChart(trend))+'</div></div>';
  html+='<div class="card p-4"><p style="font-weight:700;font-size:13.5px;margin:0 0 10px;">This month\'s expenses</p>'+(catBd.length?renderDonutChart(catBd,COLORS):'<div style="height:190px;display:flex;align-items:center;justify-content:center;"><p style="color:var(--dim);font-size:13px;">No expenses this month.</p></div>')+'</div>';
  html+='</div>';
  // Aging + Forecast
  html+='<div class="grid grid-2" style="margin-bottom:16px;">';
  html+='<div class="card pad"><p style="font-weight:700;font-size:13.5px;margin:0 0 12px;">📊 Receivables Aging</p>';
  var tRec=aging.fresh+aging.mild+aging.old;
  if(!tRec)html+='<p style="font-size:13px;color:var(--dim);">No outstanding receivables.</p>';
  else{[["0–30 days","aging-fresh",aging.fresh],["31–60 days","aging-mild",aging.mild],["60+ days","aging-old",aging.old]].forEach(function(it){if(!it[2])return;html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);"><span class="aging-chip '+it[1]+'">'+it[0]+'</span><span style="font-weight:700;">'+fmt(it[2])+'</span></div>';});if(aging.old>0)html+='<p style="font-size:11.5px;color:var(--danger);margin:8px 0 0;">⚠️ '+fmt(aging.old)+' overdue 60+ days — follow up now.</p>';}
  html+='</div>';
  html+='<div class="card pad"><p style="font-weight:700;font-size:13.5px;margin:0 0 12px;">🔮 30-Day Forecast</p>';
  if(r90.length<5)html+='<p style="font-size:13px;color:var(--dim);">Add more ledger entries for forecast.</p>';
  else html+='<div style="font-size:13px;line-height:2.1;"><div style="display:flex;justify-content:space-between;"><span style="color:var(--dim);">Avg daily income</span><span class="tone-good mono">'+fmt(Math.round(avgIn))+'/d</span></div><div style="display:flex;justify-content:space-between;"><span style="color:var(--dim);">Avg daily expense</span><span class="tone-bad mono">'+fmt(Math.round(avgEx))+'/d</span></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;font-weight:700;"><span>Est. balance in 30d</span><span class="mono '+(projBal>=0?"tone-good":"tone-bad")+'">'+fmt(Math.round(projBal))+'</span></div></div>';
  html+='</div></div>';
  // Top customers + products
  html+='<div class="grid grid-2" style="margin-bottom:16px;">';
  html+='<div class="card pad"><p style="font-weight:700;font-size:13.5px;margin:0 0 12px;">🏆 Top Customers (Month)</p>';
  if(!topCust.length)html+='<p style="font-size:13px;color:var(--dim);">No dispatches this month.</p>';
  else{var tcTot=topCust.reduce(function(s,c){return s+c[1];},0);topCust.forEach(function(c,i){var ac=state.accounts.find(function(a){return a.id===c[0];})||{name:"Unknown"};var pct=tcTot>0?Math.round(c[1]/tcTot*100):0;html+='<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);"><span style="font-size:11px;font-weight:800;color:var(--accent);min-width:18px;">#'+(i+1)+'</span><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(ac.name)+'</div><div style="height:4px;border-radius:2px;background:var(--border);margin-top:3px;"><div style="height:100%;border-radius:2px;background:var(--accent);width:'+pct+'%;"></div></div></div><span style="font-weight:700;font-size:13px;white-space:nowrap;">'+fmt(c[1])+'</span></div>';});}
  html+='</div><div class="card pad"><p style="font-weight:700;font-size:13.5px;margin:0 0 12px;">🌶️ Top Products (Month)</p>';
  if(!topProd.length)html+='<p style="font-size:13px;color:var(--dim);">No dispatches this month.</p>';
  else{var tpTot=topProd.reduce(function(s,p){return s+p[1].rev;},0);topProd.forEach(function(p,i){var sk=state.skus.find(function(s){return s.id===p[0];})||{name:"Unknown"};var pct=tpTot>0?Math.round(p[1].rev/tpTot*100):0;html+='<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);"><span style="font-size:11px;font-weight:800;color:var(--accent);min-width:18px;">#'+(i+1)+'</span><div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(sk.name)+'</div><div style="font-size:11px;color:var(--dim);">'+p[1].qty+' units · '+pct+'%</div></div><span style="font-weight:700;font-size:13px;">'+fmt(p[1].rev)+'</span></div>';});}
  html+='</div></div>';
  // Alerts
  html+='<div class="card pad"><p style="font-weight:700;font-size:13.5px;margin:0 0 10px;">🔔 Alerts</p>';
  if(!alerts.length)html+='<p style="font-size:13px;color:var(--good);">✓ All clear — no issues detected.</p>';
  else html+='<div style="display:flex;flex-direction:column;gap:8px;">'+alerts.map(function(a){var bg=a.level==="urgent"?"var(--danger-dim)":a.level==="warn"?"var(--warn-dim)":"var(--good-dim)";return'<div style="background:'+bg+';border-radius:var(--radius-sm);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;"><span style="font-size:13px;">'+esc(a.text)+'</span>'+(a.tab?'<button class="btn btn-ghost btn-sm" onclick="setTab(\''+a.tab+'\')" style="font-size:11px;white-space:nowrap;">Go →</button>':'')+' </div>';}).join('')+'</div>';
  html+='</div></div>';
  return html;
}

/* L: ACCOUNTS WITH CREDIT BARS */
function renderAccounts(){
  var tF=ui.accountType||"all",srch=(ui.accountSearch||"").toLowerCase();
  var accs=state.accounts.filter(function(a){if(tF!=="all"&&a.type!==tF)return false;if(srch&&!a.name.toLowerCase().includes(srch))return false;return true;});
  var html=sectionHead("Accounts","Retailers, distributors, and suppliers.",can('accounts.write')?'<button class="btn btn-accent" onclick="openAccountForm()">'+ic('plus',15)+' Add account</button>':'');
  html+='<div class="card pad" style="margin-bottom:12px;"><div class="flex wrap gap-2"><select class="select" style="max-width:180px;" onchange="ui.accountType=this.value;renderContent()"><option value="all">All types</option>'+['Retailer','Distributor','Institution','Supplier','Other'].map(function(t){return'<option value="'+t+'"'+(tF===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select><input class="input" style="flex:1;min-width:160px;" placeholder="Search…" value="'+esc(srch)+'" oninput="ui.accountSearch=this.value;renderContent()"></div></div>';
  if(!accs.length)return html+emptyStateHtml("No accounts match.");
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;">';
  accs.forEach(function(a){
    var out=accountOutstanding(a.id),isSup=a.type==="Supplier";
    var ld=state.dispatches.filter(function(d){return d.accountId===a.id;}).sort(function(x,y){return(y.date||"").localeCompare(x.date||"");});
    var aging=ld.length&&!isSup&&out>0?agingBucket(daysSince(ld[0].date)):null;
    var cpct=a.creditLimit&&out>0?Math.min(out/a.creditLimit*100,100):0;
    var cc=cpct>=90?"var(--danger)":cpct>=70?"var(--warn)":"var(--good)";
    html+='<div class="card pad" style="cursor:pointer;transition:box-shadow .2s;" onclick="openAccountDetail(\''+a.id+'\')" onmouseover="this.style.boxShadow=\'var(--shadow-md)\'" onmouseout="this.style.boxShadow=\'\'">';
    html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div style="min-width:0;"><div style="font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(a.name);
    if(aging&&aging.label==="60d+")html+=' <span class="aging-chip aging-old overdue-pulse" style="font-size:10px;">Overdue</span>';
    else if(aging&&aging.label==="31-60d")html+=' <span class="aging-chip aging-mild" style="font-size:10px;">30-60d</span>';
    html+='</div><div style="font-size:12px;color:var(--dim);">'+esc(a.type)+(a.contact?' · '+esc(a.contact):'')+'</div></div>';
    html+='<div style="text-align:right;flex-shrink:0;"><div style="font-size:11px;color:var(--dim);">'+(isSup?"You owe":"They owe")+'</div><div style="font-weight:700;font-size:16px;color:'+(out>0?(isSup?"var(--danger)":"var(--good)"):"var(--dimmer)")+';">'+fmt(Math.abs(out))+'</div></div></div>';
    if(a.creditLimit&&!isSup&&out>0)html+='<div class="credit-bar" style="margin-top:8px;"><div class="credit-bar-fill" style="width:'+cpct+'%;background:'+cc+';"></div></div><div style="font-size:10px;color:var(--dim);margin-top:2px;">Credit: '+Math.round(cpct)+'% used of '+fmt(a.creditLimit)+'</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

function openAccountDetail(accountId){
  var a=state.accounts.find(function(x){return x.id===accountId;});if(!a){closeModal();return;}
  var isSup=a.type==="Supplier",out=accountOutstanding(accountId);
  var body='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px;">';
  body+='<div><div style="font-weight:700;font-size:15px;">'+esc(a.name)+'</div><div style="font-size:12px;color:var(--dim);">'+esc(a.type)+(a.contact?' · '+esc(a.contact):'')+'</div></div>';
  body+='<div style="text-align:right;"><div style="font-size:11px;color:var(--dim);">'+(isSup?"You owe":"They owe")+'</div><div style="font-size:22px;font-weight:800;color:'+(out>0?(isSup?"var(--danger)":"var(--good)"):"var(--dimmer)")+';">'+fmt(Math.abs(out))+'</div></div></div>';
  if(a.creditLimit&&!isSup&&out>0){var cpct=Math.min(out/a.creditLimit*100,100),cc=cpct>=90?"var(--danger)":cpct>=70?"var(--warn)":"var(--good)";body+='<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;"><span style="color:var(--dim);">Credit utilisation</span><span style="font-weight:600;color:'+cc+';">'+Math.round(cpct)+'%</span></div><div class="credit-bar"><div class="credit-bar-fill" style="width:'+cpct+'%;background:'+cc+';"></div></div></div>';}
  // Targets
  var tmk=today().slice(0,7),tgt=(state.salesTargets||[]).find(function(t){return t.accountId===a.id&&t.month===tmk;});
  if(tgt){var ach=state.dispatches.filter(function(d){return d.accountId===a.id&&(d.date||"").slice(0,7)===tmk;}).reduce(function(s,d){return s+d.qty*d.rate;},0),tpct=Math.min(ach/tgt.amount*100,100);body+='<div style="background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;font-size:12px;"><div style="font-weight:600;margin-bottom:4px;">Month target: '+fmt(tgt.amount)+' · Achieved: '+fmt(ach)+' ('+Math.round(tpct)+'%)</div><div style="height:6px;border-radius:3px;background:var(--border);"><div style="height:100%;border-radius:3px;background:'+(tpct>=100?"var(--good)":"var(--accent)")+'";width:'+tpct+'%;"></div></div></div>';}
  // Action buttons
  body+='<div class="flex wrap gap-2" style="margin-bottom:14px;">';
  if(!isSup&&can('accounts.dispatch'))body+='<button class="btn btn-accent btn-sm" onclick="openDispatchModal(\''+a.id+'\')">'+ic('truck',14)+' Dispatch</button>';
  if(isSup&&can('inventory.write'))body+='<button class="btn btn-accent btn-sm" onclick="openPurchaseModal(null,\''+a.id+'\')">'+ic('boxes',14)+' Purchase</button>';
  if(can('accounts.payment'))body+='<button class="btn btn-outline btn-sm" onclick="openPaymentModal(\''+a.id+'\')">'+(isSup?"Pay supplier":"Receive payment")+'</button>';
  body+='<button class="btn btn-outline btn-sm" onclick="openVisitLogForm(\''+a.id+'\')">📝 Visit</button>';
  body+='<button class="btn btn-outline btn-sm" onclick="generatePriceList()">🖨️ Price list</button>';
  body+='</div>';
  // Dispatches
  if(!isSup){var disps=state.dispatches.filter(function(d){return d.accountId===accountId;}).sort(function(x,y){return(y.date||"").localeCompare(x.date||"");});if(disps.length){body+='<p style="font-weight:700;font-size:11px;color:var(--dim);margin:12px 0 6px;letter-spacing:.4px;">DISPATCHES</p>';disps.forEach(function(d){var sk=state.skus.find(function(s){return s.id===d.skuId;})||{name:"Unknown"};body+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+fmtDate(d.date)+' · <b>'+esc(sk.name)+'</b> · '+d.qty+' @ '+fmt(d.rate)+'</span><span style="display:flex;align-items:center;gap:6px;"><span class="mono">'+fmt(d.qty*d.rate)+'</span><button class="btn btn-ghost btn-sm" style="font-size:11px;padding:2px 6px;" onclick="generateInvoice(\''+d.id+'\')">🧾</button>'+(can('accounts.write')?'<button class="icon-btn" onclick="delDispatch(\''+d.id+'\',\''+a.id+'\')">'+ic('trash',13)+'</button>':'')+'</span></div>';});}}
  else{var purs=state.materialPurchases.filter(function(p){return p.supplierAccountId===accountId;}).sort(function(x,y){return(y.date||"").localeCompare(x.date||"");});if(purs.length){body+='<p style="font-weight:700;font-size:11px;color:var(--dim);margin:12px 0 6px;">PURCHASES</p>';purs.forEach(function(p){var mat=state.rawMaterials.find(function(m){return m.id===p.materialId;})||{name:"Unknown",unit:""};body+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+fmtDate(p.date)+' · <b>'+esc(mat.name)+'</b> · '+p.qty+' '+esc(mat.unit||"")+'</span><span style="display:flex;align-items:center;gap:6px;"><span class="mono">'+fmt(p.qty*p.costPerUnit)+'</span>'+(can('accounts.write')?'<button class="icon-btn" onclick="delPurchase(\''+p.id+'\',\''+a.id+'\')">'+ic('trash',13)+'</button>':'')+'</span></div>';});}}
  // Payments
  var pays=state.payments.filter(function(p){return p.accountId===accountId;}).sort(function(x,y){return(y.date||"").localeCompare(x.date||"");});

function renderMonthlyPLChart(){
  var mm={};(state.ledger||[]).forEach(function(l){var m=(l.date||"").slice(0,7);if(!m)return;if(!mm[m])mm[m]={i:0,e:0};if(l.type==="income")mm[m].i+=l.amount;else mm[m].e+=l.amount;});
  var months=Object.keys(mm).sort();if(!months.length)return'<p style="font-size:13px;color:var(--dimmer);">No ledger entries yet.</p>';
  var maxV=Math.max.apply(null,months.map(function(m){return Math.max(mm[m].i,mm[m].e);}))||1;
  var W=500,H=130,pL=55,pB=28,pT=8,pR=10,bW=Math.max(7,Math.floor((W-pL-pR)/(months.length*2+months.length*0.4)));
  var c='<div style="overflow-x:auto;"><svg viewBox="0 0 '+W+' '+(H+pB+pT)+'" style="width:100%;max-width:600px;height:auto;">';
  [0,0.25,0.5,0.75,1].forEach(function(t){var y=pT+H*(1-t);c+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/><text x="'+(pL-4)+'" y="'+(y+4)+'" text-anchor="end" font-size="9" fill="var(--dim)">'+fmtK(maxV*t)+'</text>';});
  months.forEach(function(m,i){var d=mm[m],x=pL+i*(bW*2+3),iH=Math.max(2,Math.round((d.i/maxV)*H)),eH=Math.max(2,Math.round((d.e/maxV)*H));var pts=m.split("-"),lbl=new Date(Number(pts[0]),Number(pts[1])-1,1).toLocaleDateString("en-GB",{month:"short"});c+='<rect x="'+x+'" y="'+(pT+H-iH)+'" width="'+bW+'" height="'+iH+'" fill="var(--good)" rx="2" opacity=".85"><title>Rev: '+fmt(d.i)+'</title></rect>';c+='<rect x="'+(x+bW+2)+'" y="'+(pT+H-eH)+'" width="'+bW+'" height="'+eH+'" fill="var(--danger)" rx="2" opacity=".75"><title>Exp: '+fmt(d.e)+'</title></rect>';if(months.length<=8||i%2===0)c+='<text x="'+(x+bW)+'" y="'+(pT+H+15)+'" text-anchor="middle" font-size="9" fill="var(--dim)">'+lbl+'</text>';});
  c+='<rect x="'+pL+'" y="'+(pT+H+20)+'" width="8" height="5" fill="var(--good)" rx="1"/><text x="'+(pL+11)+'" y="'+(pT+H+26)+'" font-size="9" fill="var(--dim)">Revenue</text><rect x="'+(pL+68)+'" y="'+(pT+H+20)+'" width="8" height="5" fill="var(--danger)" rx="1" opacity=".75"/><text x="'+(pL+79)+'" y="'+(pT+H+26)+'" font-size="9" fill="var(--dim)">Expense</text></svg></div>';
  var tbl='<div style="overflow-x:auto;margin-top:14px;"><table style="min-width:380px;"><thead><tr><th>Month</th><th class="right">Revenue</th><th class="right">Expenses</th><th class="right">Net P/L</th></tr></thead><tbody>';
  months.slice().reverse().forEach(function(m){var d=mm[m],net=d.i-d.e,pts=m.split("-"),lbl=new Date(Number(pts[0]),Number(pts[1])-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});tbl+='<tr><td style="font-weight:600;">'+esc(lbl)+'</td><td class="right mono tone-good">'+fmt(d.i)+'</td><td class="right mono tone-bad">'+fmt(d.e)+'</td><td class="right mono '+(net>=0?"tone-good":"tone-bad")+'" style="font-weight:700;">'+fmt(net)+'</td></tr>';});
  var allNet=totalIncome()-totalExpense();tbl+='<tr style="border-top:2px solid var(--border2);"><td style="font-weight:700;">All time</td><td class="right mono tone-good" style="font-weight:700;">'+fmt(totalIncome())+'</td><td class="right mono tone-bad" style="font-weight:700;">'+fmt(totalExpense())+'</td><td class="right mono '+(allNet>=0?"tone-good":"tone-bad")+'" style="font-weight:700;">'+fmt(allNet)+'</td></tr>';
  tbl+='</tbody></table></div>';
  return c+tbl;
}

function renderProductProfitability(from,to){
  var sm={};state.dispatches.forEach(function(d){if(from&&d.date<from)return;if(to&&d.date>to)return;if(!sm[d.skuId])sm[d.skuId]={u:0,r:0};sm[d.skuId].u+=d.qty;sm[d.skuId].r+=d.qty*d.rate;});
  var items=Object.entries(sm).map(function(e){var sk=state.skus.find(function(s){return s.id===e[0];})||{name:"Unknown",costPrice:0};var ec=sk.costPrice?e[1].u*sk.costPrice:0,gp=e[1].r-ec,mg=e[1].r?Math.round(gp/e[1].r*100):0;return{name:sk.name,u:e[1].u,r:e[1].r,ec:ec,gp:gp,mg:mg};}).sort(function(a,b){return b.r-a.r;});
  if(!items.length)return'<p style="font-size:13px;color:var(--dimmer);">No dispatches in this period.</p>';
  var h='<div style="overflow-x:auto;"><table style="min-width:500px;"><thead><tr><th>Product</th><th class="right">Units</th><th class="right">Revenue</th><th class="right">Est. cost</th><th class="right">Gross profit</th><th class="right">Margin</th></tr></thead><tbody>';
  items.forEach(function(it){h+='<tr><td style="font-weight:600;">'+esc(it.name)+'</td><td class="right mono">'+it.u+'</td><td class="right mono tone-good">'+fmt(it.r)+'</td><td class="right mono '+(it.ec?"tone-bad":"")+'">'+( it.ec?fmt(it.ec):"—")+'</td><td class="right mono '+(it.gp>=0?"tone-good":"tone-bad")+'">'+fmt(it.gp)+'</td><td class="right mono '+(it.mg>=20?"tone-good":it.mg<0?"tone-bad":"")+'">'+it.mg+'%</td></tr>';});
  return h+'</tbody></table></div>';
}
